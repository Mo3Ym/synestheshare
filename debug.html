<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SynestheShare — Debug</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', sans-serif;
    background: #f7f7f5;
    min-height: 100vh;
    padding: 2.5rem 1.5rem;
    color: #181818;
  }
  h1 {
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.2em;
    text-transform: uppercase; color: #888880;
    margin-bottom: 2rem;
    display: flex; align-items: center; gap: 0.6rem;
  }
  h1::before { content: ''; display: block; width: 20px; height: 1px; background: #888880; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
    max-width: 900px;
  }
  .card {
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    display: block;
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,0.12); }
  .card-art {
    height: 120px;
    position: relative;
    overflow: hidden;
  }
  .card-art canvas { width: 100%; height: 100%; display: block; }
  .card-body {
    background: #fff;
    padding: 1rem 1.1rem 1.1rem;
    border-top: 1px solid rgba(0,0,0,0.06);
  }
  .card-type {
    font-size: 1rem; font-weight: 700; letter-spacing: -0.01em;
    margin-bottom: 0.25rem;
  }
  .card-param {
    font-size: 0.65rem; font-family: monospace;
    color: #888880; word-break: break-all;
    line-height: 1.5;
  }
  .card-arrow {
    position: absolute; top: 0.9rem; right: 1rem;
    font-size: 0.75rem; color: #aaa;
  }
</style>
</head>
<body>
<h1>SynestheShare — Type Debug</h1>
<div class="grid" id="grid"></div>

<script>
const BASE = 'result.html';

const TYPES = [
  { id: 'warm',   name: 'SUNSET TYPE', r: '001122----', bg: '#f5ede4', colors: ['rgba(240,140,60,0.55)','rgba(224,80,40,0.28)','rgba(255,180,60,0.45)'] },
  { id: 'cool',   name: 'OCEAN TYPE',  r: '6666665555', bg: '#e8f0f8', colors: ['rgba(24,136,200,0.45)','rgba(112,40,192,0.2)','rgba(112,203,255,0.3)'] },
  { id: 'nature', name: 'FOREST TYPE', r: '334433----', bg: '#edf4e8', colors: ['rgba(42,158,96,0.4)','rgba(168,208,32,0.2)','rgba(42,158,96,0.25)'] },
  { id: 'mono',   name: 'VOID TYPE',   r: 'AABBCC----', bg: '#f0f0ee', colors: ['rgba(24,24,24,0.18)','rgba(136,136,128,0.12)','rgba(80,80,80,0.1)'] },
  { id: 'pastel', name: 'BLOOM TYPE',  r: 'CC6688CC--', bg: '#fdf0f5', colors: ['rgba(255,144,184,0.4)','rgba(112,203,255,0.35)','rgba(200,220,255,0.35)'] },
  { id: 'neon',   name: 'NEON TYPE',   r: '0101565656', bg: '#f0eef8', colors: ['rgba(224,58,42,0.45)','rgba(112,40,192,0.35)','rgba(255,220,80,0.2)'] },
  { id: 'dream',  name: 'DREAM TYPE',  r: '778855----', bg: '#f0eaf8', colors: ['rgba(176,96,232,0.45)','rgba(255,144,184,0.3)','rgba(112,40,192,0.2)'] },
  { id: 'earth',  name: 'EARTH TYPE',  r: '994433----', bg: '#f0ece4', colors: ['rgba(192,120,64,0.4)','rgba(139,69,19,0.2)','rgba(42,158,96,0.25)'] },
];

function drawMini(canvas, type) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  if (!w || !h) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  ctx.fillStyle = type.bg; ctx.fillRect(0,0,w,h);

  const rng = (() => { let s = 99; return () => { s ^= s<<13; s ^= s>>17; s ^= s<<5; return (s>>>0)/4294967296; }; })();

  type.colors.forEach((c, i) => {
    const x = w * [0.7, 0.15, 0.85][i];
    const y = h * [0.25, 0.8, 0.6][i];
    const r = w * [0.7, 0.55, 0.45][i];
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, c); g.addColorStop(1,'transparent');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  });

  for (let i = 0; i < 40; i++) {
    const x=rng()*w, y=rng()*h, r=0.5+rng()*2;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${0.1+rng()*0.25})`; ctx.fill();
  }

  const v = ctx.createRadialGradient(w/2,h/2,h*0.1,w/2,h/2,w*0.75);
  v.addColorStop(0,'transparent'); v.addColorStop(1,'rgba(0,0,0,0.1)');
  ctx.fillStyle = v; ctx.fillRect(0,0,w,h);
}

const grid = document.getElementById('grid');

TYPES.forEach(type => {
  const url = `${BASE}?mode=10&r=${type.r}`;
  const card = document.createElement('a');
  card.className = 'card';
  card.href = url;
  card.innerHTML = `
    <div class="card-art"><canvas></canvas></div>
    <div class="card-body">
      <div class="card-type">${type.name}</div>
      <div class="card-param">?mode=10&r=${type.r}</div>
    </div>
    <span class="card-arrow">→</span>
  `;
  grid.appendChild(card);

  const canvas = card.querySelector('canvas');
  requestAnimationFrame(() => drawMini(canvas, type));
});
</script>
</body>
</html>
