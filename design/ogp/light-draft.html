<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SynestheShare — OGPモック</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Noto+Sans+JP:wght@100..900&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f0f0ec; color: #2b2d38; font-family: 'Meiryo', sans-serif; }
    main { max-width: 1540px; margin: auto; padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
    .intro { margin: 0 0 28px; color: #666975; font-size: 13px; line-height: 1.8; }
    .workspace { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 28px; align-items: start; }
    form { background: #fffdf9; border: 1px solid #deded8; border-radius: 16px; padding: 8px 20px 20px; }
    fieldset { padding: 16px 0; border: 0; border-bottom: 1px solid #e7e7e0; margin: 0; min-width: 0; }
    fieldset:last-of-type { border: 0; }
    .toggle { display: flex; gap: 9px; align-items: center; font-size: 14px; font-weight: 600; cursor: pointer; }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: #526a91; }
    input[type="text"], input[type="number"] { width: 100%; margin-top: 10px; padding: 10px 11px; border: 1px solid #d6d8df; background: white; border-radius: 8px; color: #2b2d38; font: inherit; font-size: 13px; }
    input:focus-visible, button:focus-visible { outline: 3px solid #9badd6; outline-offset: 3px; }
    button { border: 1px solid #d2d5df; background: #fffdf9; color: #47516a; border-radius: 8px; padding: 9px 14px; font: inherit; font-size: 13px; cursor: pointer; }
    button:hover { background: #e8edf5; }
    button[aria-pressed="true"] { background: #263e61; color: white; border-color: #263e61; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
    .toolbar span { margin-right: 6px; font-size: 13px; color: #666975; }
    .preview { width: 100%; max-width: 600px; transition: max-width .2s; }
    .preview svg { display: block; width: 100%; height: auto; box-shadow: 0 12px 32px #22365220; border-radius: 8px; }
    .note { margin-top: 16px; font-size: 12px; color: #777b88; line-height: 1.9; }
    .colors { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
    .color { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #666975; }
    .color input { width: 34px; height: 28px; padding: 0; border: 0; background: transparent; cursor: pointer; }
    .reset { width: 100%; margin-top: 10px; }
    @media (max-width: 850px) { main { padding: 24px 16px; } .workspace { grid-template-columns: 1fr; } .display { grid-row: 1; } form { max-width: 600px; } }
    @media (prefers-reduced-motion: reduce) { .preview { transition: none; } }
    .draft-cta-surface {
      box-sizing: border-box;
      margin: 46px 64px 0;
      height: 112px;
      border: 1px solid rgba(255,160,100,.45);
      border-radius: 56px;
      background: linear-gradient(155deg, rgba(255,255,255,.58), rgba(255,255,255,.42));
      box-shadow:
        0 0 0 1px rgba(255,127,127,.14),
        0 0 18px rgba(255,127,127,.26),
        0 0 42px rgba(255,174,102,.20),
        0 12px 40px rgba(0,0,0,.06),
        inset 0 1px 0 rgba(255,255,255,.55),
        inset 0 0 0 1px rgba(255,255,255,.18),
        inset 0 0 18px rgba(255,170,100,.10);
    }
  </style>
</head>
<body>
  <main>
    <h1>OGPの情報を整理する</h1>
    <p class="intro">共感度を主役にした構成です。文言や表示項目を変えて確認できます。</p>
    <div class="workspace">
      <form id="controls">
        <fieldset>
          <label for="draft-theme">タイプ</label>
          <select id="draft-theme" name="theme">
            <option value="sunset">SUNSET</option>
            <option value="ocean" selected>OCEAN</option>
            <option value="forest">FOREST</option>
            <option value="void">VOID</option>
            <option value="bloom">BLOOM</option>
            <option value="neon">NEON</option>
            <option value="dream">DREAM</option>
            <option value="earth">EARTH</option>
          </select>
          <label class="toggle"><input type="checkbox" name="headlineVisible" checked>結果の一文</label>
          <input type="text" name="headline" value="あなたの文字色感覚は..." maxlength="48" aria-label="結果の一文">
          <input type="text" name="scoreLabel" value="共感度 上位" maxlength="10" aria-label="数値のラベル">
          <input type="number" name="score" value="40" min="0" max="100" aria-label="共感度（%）">
        </fieldset>
        <fieldset>
          <label class="toggle"><input type="checkbox" name="paletteVisible" checked>文字の色</label>
          <div class="colors" id="colors"></div>
        </fieldset>
        <fieldset>
          <label class="toggle"><input type="checkbox" name="ctaVisible" checked>診断への誘い</label>
          <input type="text" name="cta" value="結果を見て、今すぐ診断(2分)" maxlength="32" aria-label="診断への誘いの文言">
        </fieldset>
        <button type="reset" class="reset">初期状態に戻す</button>
      </form>
      <section class="display" aria-label="OGPプレビュー">
        <div class="toolbar" role="group" aria-label="プレビューの幅">
          <span>表示幅</span>
          <button type="button" data-width="360" aria-pressed="false">360px</button>
          <button type="button" data-width="600" aria-pressed="true">600px</button>
          <button type="button" data-width="1200" aria-pressed="false">原寸</button>
        </div>
        <div class="preview" id="preview"></div>
        <p class="note">1200 × 630のデザインモック。回答と一致率はサンプルです。<br>文字の色や表示項目の変更はこの画面で確認できます。画面幅が狭い場合は、収まるサイズまで縮小します。</p>
      </section>
    </div>
  </main>
  <script>
    const form = document.getElementById('controls');
    const preview = document.getElementById('preview');
    const letters = 'ABCDEFGXYZ'.split('');
    const initialColors = ['#4da8e8', '#4da8e8', '#8edfff', '#8edfff', '#67bf92', '#9272ff', '#8edfff', '#fffdf9', '#f5dc72', '#4da8e8'];
    document.getElementById('colors').innerHTML = letters.map((letter, index) => `
      <label class="color">${letter}<input type="color" name="color${index}" value="${initialColors[index]}" aria-label="${letter}の色"><input type="checkbox" name="selected${index}" checked aria-label="${letter}を選択済みにする"></label>
    `).join('');

    function escapeXml(value) {
      return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[character]));
    }

    const themeScores = {
      sunset: ['#b95049', '#b34065', '#a04385'],
      ocean: ['#00758c', '#216aad', '#5359a7'],
      forest: ['#28795a', '#20796c', '#56752d'],
      void: ['#526078', '#536086', '#705884'],
      bloom: ['#ac4877', '#9255a2', '#a95957'],
      neon: ['#9946b5', '#087a92', '#7751ae'],
      dream: ['#8051a9', '#565cb0', '#336dae'],
      earth: ['#995d35', '#8d6935', '#5e743c'],
    };
    function render() {
      const scoreColors = themeScores[form.elements.theme.value] || themeScores.ocean;
      const fields = form.elements;
      const text = (name) => escapeXml(fields[name].value);
      const dots = letters.map((letter, index) => {
        const color = fields[`color${index}`].value;
        const x = 109 + index * 109;
        const y = 363;
        if (!fields[`selected${index}`].checked) {
          return `<g filter="url(#empty-glow)"><circle cx="${x}" cy="${y}" r="39" fill="white" fill-opacity=".06" stroke="white" stroke-width="2" stroke-opacity=".38"/><text x="${x}" y="${y + 1}" text-anchor="middle" dominant-baseline="middle" font-family="Outfit,sans-serif" font-size="34.32" font-weight="700" fill="white" fill-opacity=".82">${letter}</text></g>`;
        }
        const rgb = color.match(/\w\w/g).map(channel => parseInt(channel, 16));
        const linear = rgb.map(value => value / 255 <= .03928 ? value / 255 / 12.92 : ((value / 255 + .055) / 1.055) ** 2.4);
        const bright = linear[0] * .2126 + linear[1] * .7152 + linear[2] * .0722 > .88;
        return `<g><circle cx="${x}" cy="${y}" r="39" fill="${color}"/><circle cx="${x}" cy="${y}" r="39" fill="url(#${bright ? 'glass-bright' : 'glass'})"/><circle cx="${x}" cy="${y}" r="38" fill="none" stroke="${bright ? 'black' : 'white'}" stroke-opacity="${bright ? '.08' : '.20'}"/><text x="${x}" y="${y + 1}" text-anchor="middle" dominant-baseline="middle" font-family="Outfit,sans-serif" font-size="34.32" font-weight="700" fill="${bright ? '#9698a8' : '#fffdf9'}">${letter}</text></g>`;
      }).join('');
      const prefix = fields.headline.value;
      const score = Math.max(0, Math.min(100, Number(fields.score.value) || 0));
      const textUnits = value => Array.from(value).reduce((total, character) => total + (character.charCodeAt(0) < 128 ? .56 : 1), 0);
      const headlineSize = Math.min(44, 1070 / Math.max(1, textUnits(prefix)));
      const scoreSize = score === 100 ? 180 : 190;
      const english = fields.scoreLabel.value.endsWith(' Top');
      const statLabel = fields.scoreLabel.value.replace(/\s*(上位|Top)\s*$/, '');
      const labelSize = Math.min(scoreSize / 3, 350 / Math.max(1, Array.from(statLabel).length));
      // At 100px, Outfit's digit "1" is 71px high and Noto Sans JP's
      // "上位" is 93px high. Match visible glyph height rather than font size.
      const rankSize = scoreSize / 2 * (english ? 1 : 71 / 93);
      const ctaSize = Math.min(52, 960 / Math.max(1, textUnits(fields.cta.value)));
      preview.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="card-title">
        <title id="card-title">SynestheShareの共有用OGPモック</title>
        <defs>
          <filter id="empty-glow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="white" flood-opacity=".20"/></filter>
          <linearGradient id="type-gradient"><stop stop-color="${scoreColors[0]}"/><stop offset=".5" stop-color="${scoreColors[1]}"/><stop offset="1" stop-color="${scoreColors[2]}"/></linearGradient>
          <linearGradient id="glass" x1="15.85%" y1="-9.15%" x2="84.15%" y2="109.15%"><stop stop-color="white" stop-opacity=".62"/><stop offset=".22" stop-color="white" stop-opacity=".32"/><stop offset=".42" stop-color="white" stop-opacity=".10"/><stop offset=".65" stop-color="white" stop-opacity="0"/></linearGradient>
          <linearGradient id="glass-bright" x1="15.85%" y1="-9.15%" x2="84.15%" y2="109.15%"><stop stop-color="white" stop-opacity=".48"/><stop offset=".22" stop-color="white" stop-opacity=".22"/><stop offset=".42" stop-color="white" stop-opacity=".08"/><stop offset=".65" stop-color="white" stop-opacity="0"/></linearGradient>
        </defs>
        <image href="../../assets/backgrounds/index_themes.webp" width="1200" height="630" preserveAspectRatio="xMidYMid slice"/>

        <g font-family="Noto Sans JP,Meiryo,sans-serif" fill="#263e61">
          ${fields.headlineVisible.checked ? `<text x="600" y="87" text-anchor="middle" font-size="${headlineSize}" font-weight="600">${escapeXml(prefix)}</text><text x="600" y="270" text-anchor="middle" font-size="${scoreSize}" font-family="Outfit,Arial,sans-serif" font-weight="700" fill="url(#type-gradient)"><tspan font-family="Noto Sans JP,Meiryo,sans-serif" font-size="${labelSize}" font-weight="700" fill="#263e61">${escapeXml(statLabel)}${english ? '' : '：'}</tspan><tspan dx="10" font-family="Noto Sans JP,Meiryo,sans-serif" font-size="${rankSize}" font-weight="700" fill="url(#type-gradient)">${english ? 'Top' : '上位'}</tspan><tspan dx="18">${score}</tspan><tspan font-size="${scoreSize * 2 / 3}">%</tspan></text>` : ''}
          ${fields.paletteVisible.checked ? dots : ''}
          ${fields.ctaVisible.checked ? `<foreignObject x="0" y="409" width="1200" height="221"><div xmlns="http://www.w3.org/1999/xhtml" class="draft-cta-surface"></div></foreignObject><text x="600" y="511" text-anchor="middle" dominant-baseline="middle" font-size="${ctaSize}" font-weight="600" fill="#263e61">${text('cta')}</text>` : ''}
        </g>
      </svg>`;
    }

    form.addEventListener('input', render);
    form.addEventListener('submit', event => event.preventDefault());
    form.addEventListener('reset', () => requestAnimationFrame(render));
    document.querySelectorAll('[data-width]').forEach(button => {
      button.addEventListener('click', () => {
        preview.style.maxWidth = `${button.dataset.width}px`;
        document.querySelectorAll('[data-width]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      });
    });
    render();
  </script>
</body>
</html>
