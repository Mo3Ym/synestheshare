<!-- ═══ OGP / Twitter Card ═══════════════════════════════════════
     静的フォールバック
     Cloudflare Workers が /api/og?r=... で動的OGP画像を返す構成。
     GitHub Pages では静的フォールバック画像を使用。
═════════════════════════════════════════════════════════════════ -->
<meta property="og:type"        content="website">
<meta property="og:site_name"   content="SynestheShare">
<meta property="og:title"       id="ogTitle"       content="診断結果 — SynestheShare">
<meta property="og:description" id="ogDesc"        content="あなたの文字には、どんな色が見えますか？">
<meta property="og:url"         id="ogUrl"         content="">
<meta property="og:image"       id="ogImage"       content="">
<meta property="og:image:width"                    content="1200">
<meta property="og:image:height"                   content="630">
<meta name="twitter:card"                          content="summary_large_image">
<meta name="twitter:title"      id="twTitle"       content="診断結果 — SynestheShare">
<meta name="twitter:description" id="twDesc"       content="あなたの文字には、どんな色が見えますか？">
<meta name="twitter:image"      id="twImage"       content="">
<script>
// OGPメタタグをURLから動的に設定
// Cloudflare Workers側でHTMLにog:imageを注入する際もこの構造を参照
(function() {
  const base   = location.origin;
  const params = new URLSearchParams(location.search);
  const r      = params.get('r') || '';
  const mode   = params.get('mode') || '10';
  const ogImageUrl = r
    ? `${base}/api/og?r=${encodeURIComponent(r)}&mode=${mode}`
    : `${base}/ogp.png`;
  const pageUrl = location.href;
  document.getElementById('ogUrl')   ?.setAttribute('content', pageUrl);
  document.getElementById('ogImage') ?.setAttribute('content', ogImageUrl);
  document.getElementById('twImage') ?.setAttribute('content', ogImageUrl);
})();
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --white:  #ffffff;
  --bg:     #f0f0ec;
  --ink:    #181818;
  --ink2:   #555550;
  --ink3:   #aaaaaa;
  --border: #e0e0dc;
  --c1: #e03a2a;
  --outfit: 'Outfit', sans-serif;
  --jp: "HiraginoUDSansN-W3","ヒラギノUD角ゴ ProN W3",
        "Hiragino Sans","ヒラギノ角ゴシック",
        "Meiryo UI","Meiryo",sans-serif;
  --marker-h: 24px;
  --nav-h: 54px;
}

html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: var(--jp); overflow-x: hidden; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word; }
h1,h2,h3,p { word-break: keep-all; overflow-wrap: break-word; }

/* ══ NAV（コンパクト） ══ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: var(--nav-h);
  display: flex; align-items: center; justify-content: center;
  padding: 0 1.5rem;
  background: rgba(247,247,245,0.88);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(224,224,220,0.7);
}
.nav-logo {
  position: absolute; left: 1.5rem;
  display: flex; align-items: center; text-decoration: none; height: 26px;
}
.nav-logo img { height: 100%; width: auto; display: block; }
.nav-right { position: absolute; right: 1.5rem; }
nav ul { list-style: none; display: flex; gap: 1.8rem; }
nav ul a { color: var(--ink2); text-decoration: none; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.04em; transition: color 0.15s; font-family: var(--jp); }
nav ul a:hover { color: var(--ink); }

.nav-back {
  font-family: var(--outfit); font-size: 0.72rem; font-weight: 600;
  letter-spacing: 0.1em; color: var(--ink3);
  text-decoration: none; display: flex; align-items: center; gap: 0.35rem;
  transition: color 0.15s;
}
.nav-back:hover { color: var(--ink); }

@keyframes blobdrift {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(20px,14px) scale(1.05); }
}
@keyframes spin { to { transform: rotate(360deg); } }

.type-art-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  opacity: 0;
  transition: opacity 1.2s ease;
}
.type-art-canvas.is-ready { opacity: 1; }

/* ══ ページ全体ラッパー ══ */
.page-outer {
  min-height: 100vh;
  padding-top: var(--nav-h);
}

/* ══ タイプカード（ファーストビュー・明るい背景） ══ */
.type-hero {
  position: relative; overflow: hidden;
  padding: 2.5rem 1.5rem 5rem;
  min-height: calc(100svh - var(--nav-h));
  display: flex; flex-direction: column; justify-content: center;
  background: var(--bg);
}
.type-hero-blob {
  position: absolute; border-radius: 50%; filter: blur(70px);
  pointer-events: none; z-index: 0;
}
.type-hero-blob-1 {
  width: max(500px,90vw); height: max(500px,90vw);
  top: -25%; right: -20%;
  animation: blobdrift 9s ease-in-out infinite alternate;
}
.type-hero-blob-2 {
  width: max(400px,75vw); height: max(400px,75vw);
  bottom: -20%; left: -15%;
  animation: blobdrift 13s ease-in-out infinite alternate-reverse;
}
.type-hero-inner {
  position: relative; z-index: 1;
  max-width: 640px; margin: 0 auto; width: 100%;
  display: flex; flex-direction: column; gap: 1.1rem;
}

/* ══ hero テーマ切替 ══ */
.type-hero[data-theme="dark"] { --hero-ink: #f0f0ec; --hero-ink2: rgba(240,240,236,0.65); --hero-ink3: rgba(240,240,236,0.38); --hero-border: rgba(255,255,255,0.14); --hero-stat-bg: rgba(255,255,255,0.08); --hero-stat-border: rgba(255,255,255,0.14); }
.type-hero[data-theme="light"] { --hero-ink: #181818; --hero-ink2: rgba(24,24,24,0.6); --hero-ink3: rgba(24,24,24,0.35); --hero-border: rgba(0,0,0,0.12); --hero-stat-bg: rgba(0,0,0,0.04); --hero-stat-border: rgba(0,0,0,0.1); }

.type-eyebrow { color: var(--hero-ink3); }
.type-eyebrow::before { background: var(--hero-ink3); }
.type-label { color: var(--hero-ink3); }
.type-name-color::before { background: var(--hero-border); }
.type-stat { background: var(--hero-stat-bg); border-color: var(--hero-stat-border); }
.type-stat-label { color: var(--hero-ink3); }
.scroll-indicator-label { color: var(--hero-ink3); }

/* eyebrow */
.type-eyebrow {
  font-family: var(--outfit); font-size: 0.65rem; font-weight: 600;
  letter-spacing: 0.2em; text-transform: uppercase;
  display: flex; align-items: center; gap: 0.5rem;
}
.type-eyebrow::before { content: ''; display: block; width: 18px; height: 1px; }

/* あなたの共感覚タイプ ラベル */
.type-label {
  font-family: var(--jp); font-weight: 300;
  font-size: 0.8rem; line-height: 1;
  letter-spacing: 0.02em;
}

/* 個性派センサー / 大地タイプ — 主役 */
.type-name {
  display: flex; flex-direction: column; gap: 0.1em;
}
.type-name-diag {
  font-family: var(--jp); font-weight: 700;
  font-size: clamp(1.7rem, 5.5vw, 2.6rem);
  color: var(--ink); line-height: 1.15;
  letter-spacing: -0.02em;
}
.type-name-color {
  font-family: var(--jp); font-weight: 700;
  font-size: clamp(1.7rem, 5.5vw, 2.6rem);
  line-height: 1.15; letter-spacing: -0.02em;
  display: flex; align-items: center; gap: 0.4em;
}
.type-name-color::before {
  content: '';
  display: inline-block; width: 2px; height: 1em;
  background: var(--border); border-radius: 1px;
  flex-shrink: 0;
}

/* 一致率・レア度 */
.type-stats {
  display: flex; gap: 0; margin-top: 0.2rem;
}
.type-stat {
  display: flex; flex-direction: column; gap: 0.15rem;
  padding: 0.75rem 0.85rem;
  background: rgba(255,255,255,0.72);
  border: 1px solid rgba(255,255,255,0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  flex: 1;
}
.type-stat:first-child { border-radius: 12px 0 0 12px; }
.type-stat:not(:first-child) { border-left: none; }
.type-stat:last-child  { border-radius: 0 12px 12px 0; }
.type-stat-label {
  font-family: var(--outfit); font-size: 0.6rem; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: #888880; line-height: 1;
}
.type-stat-value {
  font-family: var(--outfit); font-weight: 700;
  font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1;
  color: #181818;
}
.type-stat-sub { font-size: 0.62rem; color: var(--ink3); line-height: 1.3; }
/* タイプ診断欄（日本語は視覚的に圧力が強いため数値より少し小さく） */
.type-stat-type {
  font-family: var(--jp); font-weight: 700;
  font-size: clamp(1.15rem, 3.5vw, 1.55rem); line-height: 1.15;
  color: var(--ink);
  margin-top: 0.05rem;
}
.type-stat-denom {
  font-size: 0.55em; font-weight: 400;
  color: var(--ink3);
  letter-spacing: 0;
  vertical-align: baseline;
  margin-left: 1px;
}

/* タグライン */
.type-tagline {
  font-size: 0.8rem; color: var(--ink2);
  line-height: 1.9; font-weight: 300;
}

/* パレットドット帯 */
.type-palette-strip { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.type-palette-dot {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--outfit); font-weight: 700; font-size: 0.88rem;
}

/* 下スクロール誘導 */
.type-scroll-hint {
  display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;
  font-family: var(--outfit); font-size: 0.6rem; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink3);
}

/* ══ スクロールインジケーター ══ */
.scroll-indicator {
  position: absolute;
  bottom: 2.5rem; left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
  cursor: pointer; text-decoration: none;
  animation: scrollIndicatorFade 0.8s ease 1.2s both;
}
@keyframes scrollIndicatorFade {
  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.scroll-indicator-label {
  font-family: var(--outfit); font-size: 0.62rem; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(100,100,96,0.5);
}
.scroll-indicator-line {
  width: 1px; height: 28px;
  background: linear-gradient(to bottom, transparent, rgba(100,100,96,0.35));
}
.scroll-indicator-icon {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid rgba(100,100,96,0.18);
  background: rgba(247,247,245,0.55);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.2s, background 0.2s, transform 0.2s;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.scroll-indicator:hover .scroll-indicator-icon {
  border-color: rgba(100,100,96,0.4);
  background: rgba(247,247,245,0.85);
  transform: translateY(2px);
}
.scroll-indicator-icon svg {
  display: block;
  animation: arrowBounce 2.4s cubic-bezier(.45,.05,.55,.95) infinite;
}
@keyframes arrowBounce {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(4px); }
}
@keyframes arrowBounce {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(4px); }
}
.content-outer {
  background: #16161a;
  border-top: 1px solid rgba(255,255,255,0.06);
  position: relative; overflow: hidden;
  scroll-margin-top: var(--nav-h);
}
/* content-outer内のblobグラデーション */
.content-blob {
  position: absolute; border-radius: 50%; filter: blur(90px);
  pointer-events: none; z-index: 0;
}
.content-blob-1 {
  width: max(500px, 85vw); height: max(500px, 85vw);
  background: radial-gradient(circle, rgba(112,40,192,0.38) 0%, transparent 65%);
  top: -5%; right: -20%;
  animation: blobdrift 13s ease-in-out infinite alternate;
}
.content-blob-2 {
  width: max(420px, 75vw); height: max(420px, 75vw);
  background: radial-gradient(circle, rgba(26,136,200,0.3) 0%, transparent 65%);
  bottom: 5%; left: -20%;
  animation: blobdrift 10s ease-in-out infinite alternate-reverse;
}
.content-blob-3 {
  width: max(350px, 65vw); height: max(350px, 65vw);
  background: radial-gradient(circle, rgba(232,120,32,0.18) 0%, transparent 65%);
  top: 40%; left: 20%;
  animation: blobdrift 16s ease-in-out infinite alternate;
}
.content-wrap {
  position: relative; z-index: 1;
  max-width: 640px; margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
  display: flex; flex-direction: column; gap: 1.5rem;
}

/* ══ シェアエリア（明るい背景） ══ */
.share-outer {
  background: var(--bg);
  position: relative; overflow: hidden;
  border-top: 1px solid rgba(0,0,0,0.06);
  scroll-margin-top: var(--nav-h);
}
.share-outer .content-wrap {
  position: relative; z-index: 1;
}
.card {
  background: rgba(255,255,255,0.97);
  border: 1px solid rgba(224,224,220,0.6);
  border-radius: 14px;
  padding: 1.5rem;
  scroll-margin-top: calc(var(--nav-h) + 1rem);
}
.section-eyebrow {
  font-family: var(--outfit); font-size: 0.62rem; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink3);
  margin-bottom: 0.35rem;
}
.section-title {
  font-family: var(--jp); font-weight: 700; font-size: 1rem;
  margin-bottom: 1.25rem; color: var(--ink);
}

/* ══ 最も割れた文字ハイライト ══ */
.highlight-card {
  background: rgba(247,247,245,0.97);
  border: 1px solid rgba(224,224,220,0.6);
  border-radius: 10px;
  padding: 1.25rem 1.5rem;
  display: flex; align-items: center; gap: 1.25rem;
}
.highlight-badge {
  width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--outfit); font-weight: 700; font-size: 1.4rem;
}
.highlight-body { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; }
.highlight-label {
  font-family: var(--outfit); font-size: 0.6rem; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink3);
}
.highlight-text { font-size: 0.82rem; color: var(--ink2); line-height: 1.5; }
.highlight-text strong { color: var(--ink); }
.highlight-comment {
  font-size: 0.75rem; color: var(--ink3);
  font-style: italic; line-height: 1.5;
  margin-top: 0.1rem;
}
/* ハイライトのミニバー（▼あなた付き） */
.highlight-bar-wrap {
  margin-top: 0.5rem;
  position: relative;
  padding-top: var(--marker-h);
}
.highlight-bar {
  display: flex; height: 10px; border-radius: 100px; overflow: hidden;
  background: rgba(0,0,0,0.06);
}
.highlight-bar-seg { height: 100%; flex-shrink: 0; width: 0%; }
.highlight-mine-marker {
  position: absolute; top: 0; height: var(--marker-h);
  font-family: var(--outfit); font-size: 0.52rem; font-weight: 700;
  color: var(--ink); white-space: nowrap;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  transform: translateX(-50%); line-height: 1.3;
  pointer-events: none; padding-bottom: 2px;
}
.highlight-mine-marker::after { content: '▼'; font-size: 0.48rem; color: var(--ink); line-height: 1; }

/* ══ Your Sense カード ══ */
/* 2列グリッド */
.sense-grid {
  display: flex; flex-direction: column; gap: 1.75rem;
}
.sense-col { display: flex; flex-direction: column; gap: 0.6rem; }
.sense-col-label {
  font-family: var(--jp); font-weight: 700; font-size: 1rem;
  color: var(--ink);
}
.sense-divider { height: 1px; background: var(--border); margin: 0.25rem 0; }

/* 1行レイアウト：左＝色エリア、右＝テキスト */
.sense-row {
  display: flex; align-items: flex-start; gap: 0.85rem;
}

/* 色エリア（左） */
.sense-circles {
  display: flex; align-items: flex-start; flex-shrink: 0;
}
.sense-circle-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
  width: 48px;
}
.sense-circle {
  border-radius: 50%;
  width: 38px; height: 38px;
}
.sense-circle-label {
  font-family: var(--outfit); font-size: 0.65rem; font-weight: 700;
  color: var(--ink2); text-align: center; line-height: 1.3;
  white-space: nowrap;
}
/* vs / = 記号 */
.sense-op {
  font-family: var(--outfit); font-size: 0.75rem; font-weight: 700;
  color: var(--ink3); flex-shrink: 0; line-height: 1;
  width: 22px; text-align: center;
  margin-top: calc(19px - 0.375rem);
}

/* テキストエリア（右） */
.sense-text { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; min-width: 0; padding-top: 0.15rem; }
.sense-sentence {
  font-size: 0.72rem; color: var(--ink2); line-height: 1.65;
  word-break: keep-all; overflow-wrap: break-word;
}
.sense-strong { font-family: var(--outfit); font-weight: 700; color: var(--ink); }
.sense-color-word { font-weight: 700; }
.sense-comment { font-size: 0.65rem; color: var(--ink3); font-style: italic; line-height: 1.6; }

/* 文言行 */
.empathy-pct-label { font-size: 0.75rem; color: var(--ink2); line-height: 1.5; }
.empathy-comment { font-size: 0.72rem; color: var(--ink3); font-style: italic; line-height: 1.5; margin-top: 0.1rem; }
.empathy-badge {
  width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--outfit); font-weight: 700; font-size: 1.3rem;
}

/* ══ 投票グラフ ══ */
.vote-list { display: flex; flex-direction: column; gap: 1.25rem; }
.vote-item { display: flex; flex-direction: column; gap: 0.35rem; }
.vote-item-row {
  display: flex; align-items: flex-start; gap: 0.6rem;
}
.vote-letter-badge {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--outfit); font-weight: 700; font-size: 0.78rem;
  flex-shrink: 0;
  margin-top: calc(var(--marker-h) - 5px);
}
.vote-stacked-outer {
  flex: 1; position: relative;
  padding-top: var(--marker-h);
}
.vote-stacked-track {
  height: 16px; border-radius: 100px; overflow: hidden;
  display: flex; background: rgba(0,0,0,0.06);
}
.vote-stacked-seg { height: 100%; flex-shrink: 0; width: 0%; }
.vote-stacked-seg:first-child { border-radius: 100px 0 0 100px; }
.vote-stacked-seg:last-child  { border-radius: 0 100px 100px 0; }
.vote-stacked-seg:only-child  { border-radius: 100px; }

.vote-mine-marker {
  position: absolute; top: 0; height: var(--marker-h);
  font-family: var(--outfit); font-size: 0.52rem; font-weight: 700;
  color: var(--ink); white-space: nowrap;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  transform: translateX(-50%); line-height: 1.3;
  pointer-events: none; padding-bottom: 2px;
}
.vote-mine-marker::after { content: '▼'; font-size: 0.48rem; color: var(--ink); line-height: 1; }

.vote-legend {
  display: flex; flex-wrap: wrap; gap: 0.2rem 0.75rem;
  padding-left: calc(28px + 0.6rem);
}
.vote-legend-item { display: flex; align-items: baseline; gap: 0.28rem; }
.vote-legend-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.08); align-self: center;

  V: [{color:'#7028c0',name:'紫',pct:44},{color:'#e03a2a',name:'赤',pct:26},{color:'#1888c8',name:'青',pct:18},{color:'#181818',name:'黒',pct:12}],

};

/* ══ alphabetのプリセット13色（ティールなし） ══ */
const ALPHABET_PRESETS = [
  {color:'#e03a2a', name:'赤'},
  {color:'#e87820', name:'橙'},
  {color:'#f0e040', name:'黄'},
  {color:'#a8d020', name:'黄緑'},
  {color:'#2a9e60', name:'緑'},
  {color:'#1888c8', name:'青'},
  {color:'#70cbff', name:'水色'},

  {color:'#ff90b8', name:'ピンク'},
  {color:'#8b4513', name:'茶色'},
  {color:'#181818', name:'黒'},
  {color:'#888880', name:'グレー'},
  {color:'#ffffff', name:'白'},
];

/* カスタム色 → 最近傍プリセット色に変換（Lab近似としてrgbユークリッド距離） */
function snapToPreset(hex) {
  if (!hex) return hex;
  // すでにプリセットなら即返す
  if (ALPHABET_PRESETS.some(p => p.color === hex)) return hex;
  const { r: r0, g: g0, b: b0 } = hexToRgb(hex);
  let best = ALPHABET_PRESETS[0].color, bestDist = Infinity;
  ALPHABET_PRESETS.forEach(p => {
    const { r, g, b } = hexToRgb(p.color);
    // 明度重み付きユークリッド距離（人間の色知覚に近い近似）
    const dist = 2*(r-r0)**2 + 4*(g-g0)**2 + 3*(b-b0)**2;
    if (dist < bestDist) { bestDist = dist; best = p.color; }
  });
  return best;
}

/* ══ URLパラメータ解析 ══ */
const params = new URLSearchParams(location.search);
const isFullMode = params.get('mode') === '26';
const LETTERS_10 = ['A','B','C','D','E','F','G','X','Y','Z'];
const LETTERS_26 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const letters = isFullMode ? LETTERS_26 : LETTERS_10;

/* 色IDマップ */
const COLOR_IDS = '0123456789ABC';

const colorMap = {};
const rParam = params.get('r');
if (rParam) {
  // 新方式：?mode=10&r=05A2-...
  letters.forEach((l, i) => {
    const id = rParam[i];
    if (!id || id === '-') return;
    const idx = COLOR_IDS.indexOf(id);
    if (idx >= 0) colorMap[l] = ALPHABET_PRESETS[idx]?.color || null;
    if (colorMap[l] === null) delete colorMap[l];
  });
} else {
  // 旧方式との後方互換：?A=%23e03a2a&B=...
  letters.forEach(l => {
    const c = params.get(l);
    if (c) colorMap[l] = snapToPreset(c);
  });
}

/* ══ 色名を取得（プリセット照合、なければ概算） ══ */
const PRESET_COLORS = ['#e03a2a','#e87820','#f0e040','#a8d020','#2a9e60','#1888c8','#70cbff','#7028c0','#ff90b8','#8b4513','#181818','#888880','#ffffff'];
const PRESET_LABELS = ['赤','橙','黄','黄緑','緑','青','水色','紫','ピンク','茶色','黒','グレー','白'];
function getColorName(hex) {
  const idx = PRESET_COLORS.indexOf(hex?.toLowerCase());
  if (idx >= 0) return PRESET_LABELS[idx];
  // 近似hueで概算
  if (!hex) return '不明';
  const { h, s, l } = rgbToHsl(hex);
  if (s < 0.12) {
    if (l > 0.85) return '白系'; if (l < 0.25) return '黒系'; return 'グレー系';
  }
  if (h < 20 || h >= 345) return '赤系';
  if (h < 45) return '橙系';
  if (h < 70) return '黄系';
  if (h < 150) return '緑系';
  if (h < 190) return 'ティール系';
  if (h < 250) return '青系';
  if (h < 290) return '紫系';
  return 'ピンク系';
}

/* ══ ユーティリティ ══ */
function hexToRgb(hex) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function getLuminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  const t = c => { c /= 255; return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  return 0.2126*t(r) + 0.7152*t(g) + 0.0722*t(b);
}
function rgbToHsl(hex) {
  let { r, g, b } = hexToRgb(hex);
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0, s=0, l=(max+min)/2;
  if (max!==min) {
    const d=max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=((g-b)/d+(g<b?6:0))/6; break;
      case g: h=((b-r)/d+2)/6; break;
      case b: h=((r-g)/d+4)/6; break;
    }
  }
  return { h:h*360, s, l };
}
function isBright(hex) { return getLuminance(hex) > 0.88; }
function textColorFor(bg) {
  if (!bg) return 'var(--ink3)';
  return isBright(bg) ? '#888880' : '#ffffff';
}

/* 背景テーマに対してアクセントカラーのコントラストを確保する
   light背景: 輝度 > 0.55 なら暗くする
   dark背景:  輝度 < 0.12 なら明るくする */
function ensureContrast(hex, theme) {
  const lum = getLuminance(hex);
  const { r, g, b } = hexToRgb(hex);
  if (theme === 'light' && lum > 0.55) {
    return `rgb(${Math.round(r*0.55)},${Math.round(g*0.55)},${Math.round(b*0.55)})`;
  }
  if (theme === 'dark' && lum < 0.12) {
    return `rgb(${Math.min(255,Math.round(r*2.2+80))},${Math.min(255,Math.round(g*2.2+80))},${Math.min(255,Math.round(b*2.2+80))})`;
  }
  return hex;
}

/* ══ 診断スコア計算 ══ */
function calcDiagnosis() {
  const coloredLetters = letters.filter(l => colorMap[l]);
  const total = coloredLetters.length;
  if (total === 0) return null;

  let majorityCount = 0; // 自分の色が1位と一致した数
  let raritySum = 0;     // 自分の色の順位（小さいほどレア）

  coloredLetters.forEach(l => {
    const myColor = colorMap[l];
    const votes = DUMMY_VOTES[l] || [];
    if (!votes.length) return;

    // 自分の色がvotesに何位にあるか
    // 完全一致なければ近似色で探す
    let myRank = votes.findIndex(v => v.color === myColor);
    if (myRank === -1) {
      // 近似: hueが最も近いものを採用
      const myH = rgbToHsl(myColor).h;
      let minDiff = 999; let bestIdx = 0;
      votes.forEach((v, i) => {
        const diff = Math.abs(rgbToHsl(v.color).h - myH);
        if (Math.min(diff, 360-diff) < minDiff) { minDiff = Math.min(diff, 360-diff); bestIdx = i; }
      });
      myRank = bestIdx;
    }
    if (myRank === 0) majorityCount++;
    raritySum += myRank;
  });

  const majorityRate = Math.round(majorityCount / total * 100);
  const avgRank = raritySum / total; // 0=全部1位（多数派）、高いほどレア
  const rareScore = Math.min(100, Math.round(avgRank * 28));

  return { majorityRate, rareScore, total, majorityCount };
}

function detectColorType(coloredLetters) {
  const counts = {};
  coloredLetters.forEach(l => {
    const c = colorMap[l];
    counts[c] = (counts[c] || 0) + 1;
  });
  const total = coloredLetters.length;
  const hasBrown = (counts['#8b4513']||0) >= 1;

  const warm   = ((counts['#e03a2a']||0) + (counts['#e87820']||0) + (counts['#f0e040']||0)) / total;
  const cool   = ((counts['#1888c8']||0) + (counts['#70cbff']||0) + (counts['#7028c0']||0)) / total;
  const nature = ((counts['#2a9e60']||0) + (counts['#a8d020']||0)) / total;
  const mono   = ((counts['#181818']||0) + (counts['#888880']||0) + (counts['#ffffff']||0)) / total;
  const pastel = ((counts['#ffffff']||0) + (counts['#70cbff']||0) + (counts['#ff90b8']||0) + (counts['#f0e040']||0)) / total;
  const dream  = ((counts['#7028c0']||0) + (counts['#ff90b8']||0) + (counts['#1888c8']||0)) / total;
  // earth は茶色必須。茶色がなければカウントしない
  const earth  = hasBrown
    ? ((counts['#8b4513']||0) + (counts['#2a9e60']||0) + (counts['#a8d020']||0)) / total
    : 0;

  if (mono >= 0.55) return 'mono';
  if (earth >= 0.4) return 'earth';                   // 茶色ありのときのみ
  if (pastel >= 0.55 && warm < 0.3 && cool < 0.3) return 'pastel';
  if (dream >= 0.5 && warm < 0.2) return 'dream';
  if (cool >= 0.5 && warm < 0.2) return 'cool';
  if (nature >= 0.45 && warm < 0.3) return 'nature';
  if (warm >= 0.45) return 'warm';
  if (warm >= 0.22 && cool >= 0.22) return 'neon';
  // フォールバック：earthを除いたスコアで最大を選ぶ
  const scores = { warm, cool, nature, mono, dream, pastel };
  return Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
}

/* ══ 最も個性的な文字を計算（共用） ══ */
function calcMostUnique(coloredLetters) {
  let mostUnique = null, lowestMyPct = 101;
  coloredLetters.forEach(l => {
    const myColor = colorMap[l];
    const votes = DUMMY_VOTES[l] || [];
    if (!votes.length) return;
    const myMatchIdx = votes.findIndex(v => v.color === myColor);
    if (myMatchIdx === 0) return;
    const myPct = myMatchIdx === -1 ? 0 : votes[myMatchIdx].pct;
    if (myPct < lowestMyPct) { lowestMyPct = myPct; mostUnique = l; }
  });
  const isAllMajority = !mostUnique;
  if (!mostUnique) {
    let maxPct = -1;
    coloredLetters.forEach(l => {
      const votes = DUMMY_VOTES[l] || [];
      if (!votes.length) return;
      if (votes[0].pct > maxPct) { maxPct = votes[0].pct; mostUnique = l; }
    });
  }
  return { mostUnique, isAllMajority };
}

  const uniqueCommentHtml = `<div class="empathy-comment">${
    isAllMajority ? 'あなたの共感覚は、<wbr>多くの人と共鳴しています。'
    : isOutlier ? '誰とも重ならない、<wbr>あなただけの色。'
    : uMyPct <= 10 ? 'ほとんどの人とは<wbr>違う感覚を持っています。'
    : uMyPct <= 20 ? '少数派の感覚。<wbr>その見え方は、<wbr>あなたならでは。'
    : '世間とは少し違う、<wbr>独自の感覚。'
  }</div>`;

  const uniqueText = `${uniquePctHtml}${uniqueLabelHtml}${uniqueCommentHtml}`;

  // ── 共感：最も共感された文字 ──
  let mostEmpathy = null, highestPct = -1;
  coloredLetters.forEach(l => {
    const myColor = colorMap[l];
    const votes = DUMMY_VOTES[l] || [];
    if (!votes.length) return;
    if (votes.findIndex(v => v.color === myColor) !== 0) return;
    if (votes[0].pct > highestPct) { highestPct = votes[0].pct; mostEmpathy = l; }
  });

  const eColor = mostEmpathy ? colorMap[mostEmpathy] : null;
  const empathyBadge = !mostEmpathy
    ? `<div class="empathy-badge" style="background:transparent;font-size:1.8rem;border:none">🌀</div>`
    : `<div class="empathy-badge" style="background:${eColor};color:${textColorFor(eColor)};${isBright(eColor)?'box-shadow:inset 0 0 0 2px rgba(0,0,0,0.15)':''}">${mostEmpathy}</div>`;

  const empathyComment = !mostEmpathy ? 'あなたの感覚は、<wbr>誰とも違う独自の宇宙を<wbr>持っています。'
    : highestPct >= 70 ? 'その感覚は、<wbr>多くの人の心と<wbr>静かに重なっています。'
    : highestPct >= 50 ? '2人に1人以上が、<wbr>あなたと同じ色を<wbr>感じていました。'
    : 'それぞれの感じ方の中に、<wbr>確かな共鳴がありました。';

  const eColorName = eColor ? getColorName(eColor) : '';

  const empathyLabelHtml = !mostEmpathy
    ? `<div class="empathy-pct-label">すべての文字で<wbr>世間と異なる色を<wbr>選んでいました。</div>`
    : `<div class="sense-sentence">
        <span class="sense-strong">${highestPct}%</span>の人が、${mostEmpathy}にあなたと同じ<span class="sense-color-word" style="color:${isBright(eColor)?'var(--ink)':eColor}">${eColorName}</span>を感じていました。
      </div>`;

  const empathyText = `${empathyLabelHtml}<div class="empathy-comment">${empathyComment}</div>`;

  // ── 個性：色円HTML ──
  const uTopColorHex2 = uVotes[0]?.color || '#888880';
  const uCirclesHtml = isAllMajority
    ? `<div class="sense-circle-wrap">
         <div style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem">🎯</div>
       </div>`
    : `<div class="sense-circle-wrap">
         <div class="sense-circle mine" style="background:${uColor};color:${textColorFor(uColor)};${isBright(uColor)?'box-shadow:inset 0 0 0 1.5px rgba(0,0,0,0.15)':'box-shadow:0 0 0 1.5px rgba(255,255,255,0.15)'};display:flex;align-items:center;justify-content:center;font-family:var(--outfit);font-weight:700;font-size:1.05rem">${mostUnique}</div>
         <span class="sense-circle-label">あなた</span>
       </div>
       <div class="sense-op">vs</div>
       <div class="sense-circle-wrap">
         <div class="sense-circle theirs" style="background:${uTopColorHex2};color:${textColorFor(uTopColorHex2)};${isBright(uTopColorHex2)?'box-shadow:inset 0 0 0 1.5px rgba(0,0,0,0.15)':'box-shadow:0 0 0 1.5px rgba(255,255,255,0.15)'};display:flex;align-items:center;justify-content:center;font-family:var(--outfit);font-weight:700;font-size:1.05rem">${mostUnique}</div>
         <span class="sense-circle-label">みんな</span>
       </div>`;

  // ── 共感：色円HTML ──
  const eCirclesHtml = !mostEmpathy
    ? `<div class="sense-circle-wrap">
         <div style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem">🌀</div>
       </div>`
    : `<div class="sense-circle-wrap">
         <div class="sense-circle mine" style="background:${eColor};color:${textColorFor(eColor)};${isBright(eColor)?'box-shadow:inset 0 0 0 1.5px rgba(0,0,0,0.15)':'box-shadow:0 0 0 1.5px rgba(255,255,255,0.15)'};display:flex;align-items:center;justify-content:center;font-family:var(--outfit);font-weight:700;font-size:1.05rem">${mostEmpathy}</div>
         <span class="sense-circle-label">あなた</span>
       </div>
       <div class="sense-op">=</div>
       <div class="sense-circle-wrap">
         <div class="sense-circle theirs" style="background:${eColor};color:${textColorFor(eColor)};${isBright(eColor)?'box-shadow:inset 0 0 0 1.5px rgba(0,0,0,0.15)':'box-shadow:0 0 0 1.5px rgba(255,255,255,0.15)'};display:flex;align-items:center;justify-content:center;font-family:var(--outfit);font-weight:700;font-size:1.05rem">${mostEmpathy}</div>
         <span class="sense-circle-label">みんな</span>
       </div>`;

  return `<div class="card">
    <div class="section-eyebrow">Your Sense</div>
    <div class="sense-grid">
      <div class="sense-col">
        <div class="sense-col-label">最も個性的だった文字</div>
        ${isAllMajority
          ? `<div class="sense-row">
               <div style="font-size:1.8rem;flex-shrink:0;width:calc(48px + 22px + 48px);text-align:center">🎯</div>
               <div class="sense-text">${uniqueText}</div>
             </div>`
          : `<div class="sense-row">
               <div class="sense-circles">${uCirclesHtml}</div>
               <div class="sense-text">${uniqueText}</div>
             </div>`
        }
      </div>
      <div class="sense-divider"></div>
      <div class="sense-col">
        <div class="sense-col-label">最も共感された文字</div>
        ${!mostEmpathy
          ? `<div class="sense-row">
               <div style="font-size:1.8rem;flex-shrink:0;width:calc(48px + 22px + 48px);text-align:center">🌀</div>
               <div class="sense-text">${empathyText}</div>
             </div>`
          : `<div class="sense-row">
               <div class="sense-circles">${eCirclesHtml}</div>
               <div class="sense-text">${empathyText}</div>
             </div>`
        }
      </div>
    </div>
  </div>`;
}

function buildVoteSection(coloredLetters) {
  const buildItem = (l) => {
    const myColor = colorMap[l];
    const votes = DUMMY_VOTES[l] || [];
    if (!votes.length) return '';

    const myMatchIdx = votes.findIndex(v => v.color === myColor);
    const isOutlier = myMatchIdx === -1;

    let markerLeftPct = 0;
    if (!isOutlier) {
      let accBefore = 0;
      for (let i = 0; i < myMatchIdx; i++) accBefore += votes[i].pct;
      markerLeftPct = accBefore + votes[myMatchIdx].pct / 2;
    }

    let segsHtml = '';
    votes.forEach((v) => {
      segsHtml += `<div class="vote-stacked-seg" style="background:${v.color}" data-pct="${v.pct}"></div>`;
    });

    let legendHtml = '<div class="vote-legend">';
    votes.forEach((v) => {
      legendHtml += `<div class="vote-legend-item">
        <div class="vote-legend-dot" style="background:${v.color}${isBright(v.color)?';box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12)':''}"></div>
        <span class="vote-legend-label">${v.name}</span>
        <span class="vote-legend-pct">${v.pct}%</span>
      </div>`;
    });
    legendHtml += '</div>';

    const markerHtml = isOutlier
      ? ''
      : `<div class="vote-mine-marker" style="left:${markerLeftPct}%"><span>あなた</span></div>`;

    const outlierHtml = isOutlier
      ? `<div class="vote-outlier">
          <div class="vote-outlier-dot" style="background:${myColor};${isBright(myColor)?'box-shadow:inset 0 0 0 1.5px rgba(0,0,0,0.15)':''}"></div>
          <span><strong>${getColorName(myColor)}</strong>は、上位に入らない希少な選択です</span>
        </div>`
      : '';

    return `<div class="vote-item">
      <div class="vote-item-row">
        <div class="vote-letter-badge" style="background:${myColor};color:${textColorFor(myColor)};${isBright(myColor)?'box-shadow:inset 0 0 0 1.5px rgba(0,0,0,0.15)':''}">${l}</div>
        <div class="vote-stacked-outer">
          <div class="vote-marker-row">${markerHtml}</div>
          <div class="vote-stacked-track">${segsHtml}</div>
        </div>
      </div>
      ${outlierHtml}
      ${legendHtml}
    </div>`;
  };

  const visible = coloredLetters.slice(0, 3);
  const hidden  = coloredLetters.slice(3);

  let html = `<div class="card">
    <div class="section-eyebrow">Vote</div>
    <div class="section-title">各文字の色<wbr> — 世間との比較</div>
    <div class="vote-collapse-wrap" id="voteCollapseWrap">
      <div class="vote-list">
        ${visible.map(buildItem).join('')}
      </div>`;

  if (hidden.length > 0) {
    html += `
      <div class="vote-hidden-list">
        ${hidden.map(buildItem).join('')}
      </div>
      <div class="vote-fade-overlay"></div>
      <button class="vote-more-btn" id="votMoreBtn" aria-label="すべて表示">︙</button>`;
  }

  html += `
    </div>
  </div>`;
  return html;
}

/* ══ 診断セクション①：共感覚タイプ（レア度ベース） ══ */
function buildDiagSection(diag) {
  const type = getDiagType(diag.majorityRate, diag.rareScore);
  return `<div class="card">
    <div class="section-eyebrow">Diagnosis — 1 / 2</div>
    <div class="section-title">あなたの<wbr>共感覚タイプ</div>
    <div class="diag-body">
      <div class="diag-type-main" style="color:${type.color}">${type.label}</div>
      <div class="diag-type-desc">${type.desc.replace(/。/g, '。<br>')}</div>
    </div>
    <div class="diag-basis">
      多数派一致率：<strong>${diag.majorityRate}%</strong>（${diag.majorityCount}/${diag.total}文字が世間と一致）<br>レア度：<strong>${diag.rareScore}</strong>
    </div>
  </div>`;
}

/* ══ 診断セクション②：色傾向タイプ（色の分布ベース） ══ */
function buildColorTypeSection(coloredLetters, diag) {
  const typeId = detectColorType(coloredLetters);
  const type = COLOR_TYPES.find(t => t.id === typeId) || COLOR_TYPES[0];
  const typeColor = type.color || 'rgba(24,24,24,0.88)';

  // 主な色グループの集計（上位3色）
  const counts = {};
  coloredLetters.forEach(l => { const c = colorMap[l]; counts[c] = (counts[c]||0)+1; });
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const basisDots = sorted.map(([c, n]) => {
    const shadow = isBright(c) ? 'box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12)' : '';
    return `<span class="diag-basis-dot" style="background:${c};${shadow}"></span>${getColorName(c)}（${n}文字）`;
  }).join('、');

  return `<div class="card">
    <div class="section-eyebrow">Diagnosis — 2 / 2</div>
    <div class="section-title">タイプ診断</div>
    <div class="diag-body">
      <div class="diag-type-main" style="color:${typeColor}">${type.name}</div>
      <div class="diag-type-desc">${type.tagline.replace(/(<wbr>)?\n/g, '<br>').replace(/。(?!<br>)/g, '。<br>')}</div>
    </div>
    <div class="diag-basis">
      選んだ色の傾向：<br>${basisDots}
    </div>
  </div>`;
}

/* ══ シェアセクション HTML生成 ══ */
function buildShareSection(diag, coloredLetters) {
  const typeId = detectColorType(coloredLetters);
  const colorType = COLOR_TYPES.find(t => t.id === typeId) || COLOR_TYPES[0];
  const diagType = getDiagType(diag.majorityRate, diag.rareScore);

  // blob用の上位2色
  const counts = {};
  coloredLetters.forEach(l => { const c = colorMap[l]; counts[c] = (counts[c]||0)+1; });
  const topColors = Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  const typeColor = colorType.color || '#181818';

  // シェアカードのドット
  const dots = coloredLetters.map(l =>
    `<div class="share-card-dot" style="background:${colorMap[l]};${isBright(colorMap[l])?'box-shadow:inset 0 0 0 1.5px rgba(0,0,0,0.15)':'border:1px solid rgba(255,255,255,0.12)'}"></div>`
  ).join('');

  // STEP2: 「感覚を見せる」方向のXシェアテキスト
  // result URL（自分の結果が開く）をシェア
  const resultUrl = `${location.origin}/result.html${location.search}`;
  const shareText = `私の文字には、こんな色が見えています。\n\n${colorType.name} / ${diagType.label}\n多数派一致率: ${diag.majorityRate}% ／ レア度: ${diag.rareScore}\n\nあなたの文字には、どんな色が見えますか？\n#SynestheShare #共感覚\n${resultUrl}`;
  const xUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}`;

  return `<div class="card">
    <div class="section-eyebrow">Share</div>
    <div class="section-title">結果を<wbr>シェアする</div>
    <div class="share-section">
      <div class="share-card-preview" id="shareCardPreview">
        <div class="share-card-blob" style="width:200px;height:200px;top:-40px;right:-40px;background:radial-gradient(circle,rgba(${(()=>{const {r,g,b}=hexToRgb(topColors[0]||'#e03a2a');return `${r},${g},${b}`})()},0.2) 0%,transparent 70%)"></div>
        <div class="share-card-blob" style="width:160px;height:160px;bottom:-30px;left:-30px;background:radial-gradient(circle,rgba(${(()=>{const {r,g,b}=hexToRgb(topColors[1]||topColors[0]||'#1888c8');return `${r},${g},${b}`})()},0.15) 0%,transparent 70%)"></div>
        <div class="share-card-inner">
          <div class="share-card-eyebrow">SynestheShare — Alphabet</div>
          <div class="share-card-title"><span style="color:${diagType.color}">${diagType.label}</span><span style="color:var(--ink3);font-weight:300;margin:0 0.2em">/</span><span style="color:${typeColor};opacity:0.7">${colorType.name}</span></div>
          <div class="share-card-palette">${dots}</div>
          <div class="share-card-stats">多数派一致率 ${diag.majorityRate}% ／ レア度 ${diag.rareScore}</div>
          <div class="share-card-tag">#SynestheShare</div>
        </div>
      </div>
      <div class="share-btn-row">
        <button class="btn-save-image" id="btnSaveImage">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1v8M4 6l3 3 3-3M1 10v1a2 2 0 002 2h8a2 2 0 002-2v-1"/></svg>
          画像を保存
        </button>
        <button class="btn-x-share" id="btnXShare" data-url="${xUrl}">
          <svg class="x-logo" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.742l7.73-8.835L1.254 2.25H8.08l4.253 5.623L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>
          Xにシェア
        </button>
        <button class="btn-copy-share" id="btnCopyShare" data-text="${shareText.replace(/"/g,'&quot;')}">
          📋 テキストをコピー
        </button>
      </div>
    </div>
  </div>`;
}

/* ══ メイン描画 ══ */
function render() {
  const typeHeroArea = document.getElementById('typeHeroArea');
  const mainWrap = document.getElementById('mainWrap');
  const coloredLetters = letters.filter(l => colorMap[l]);

  if (coloredLetters.length === 0) {
    typeHeroArea.innerHTML = '';
    mainWrap.innerHTML = `<div class="card" style="text-align:center;padding:3rem">
      <p style="color:var(--ink3);margin-bottom:1rem">色が設定されていません</p>
      <a class="btn-back" href="alphabet.html" style="margin:auto">← 診断ページに戻る</a>
    </div>`;
    return;
  }

  const diag = calcDiagnosis();

  // blob用の上位2色（typeHero・shareOuter共用）
  const counts = {};
  coloredLetters.forEach(l => { const c = colorMap[l]; counts[c] = (counts[c]||0)+1; });
  const topColors = Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);

  setTimeout(() => {
    // ① ファーストビュー
    typeHeroArea.innerHTML = buildTypeHero(coloredLetters, diag);

    // アートcanvas描画
    const artCanvas = document.getElementById('artCanvas');
    if (artCanvas) {
      const typeId = document.querySelector('.type-hero')?.dataset.type || 'warm';
      requestAnimationFrame(() => drawArtCanvas(typeId, artCanvas));
    }

    // ② ダークエリア（診断・グラフ・ハイライト）
    mainWrap.innerHTML =
      buildDiagSection(diag).replace('<div class="card">', '<div class="card" id="diagnosis">') +
      buildColorTypeSection(coloredLetters, diag).replace('<div class="card">', '<div class="card" id="colortype">') +
      buildSenseCard(coloredLetters).replace('<div class="card">', '<div class="card" id="uniqueness">') +
      buildVoteSection(coloredLetters).replace('<div class="card">', '<div class="card" id="vote">');

    // ③ シェアエリア（明るい背景）
    const shareOuter = document.getElementById('shareOuter');
    const { r: r1, g: g1, b: b1 } = hexToRgb(topColors[0] || '#e03a2a');
    const { r: r2, g: g2, b: b2 } = hexToRgb(topColors[1] || topColors[0] || '#1888c8');
    shareOuter.innerHTML = `
      <div class="share-blob" style="position:absolute;width:max(400px,90vw);height:max(400px,90vw);border-radius:50%;filter:blur(70px);pointer-events:none;top:-25%;right:-20%;background:radial-gradient(circle,rgba(${r1},${g1},${b1},0.5) 0%,transparent 65%)"></div>
      <div class="share-blob" style="position:absolute;width:max(320px,75vw);height:max(320px,75vw);border-radius:50%;filter:blur(60px);pointer-events:none;bottom:-15%;left:-15%;background:radial-gradient(circle,rgba(${r2},${g2},${b2},0.38) 0%,transparent 65%)"></div>
      <div class="content-wrap">${buildShareSection(diag, coloredLetters)}</div>
      <div class="diag-btn-wrap">
        <a class="btn-diag" href="alphabet.html">最初から診断する →</a>
      </div>`;

    // バーアニメーション（最初の3件）
    document.querySelectorAll('.vote-list:not(.vote-hidden-list) .vote-stacked-seg').forEach((el, i) => {
      const pct = el.dataset.pct;
      el.style.transition = `width 0.75s cubic-bezier(.34,1.1,.64,1) ${i * 40}ms`;
      requestAnimationFrame(() => { requestAnimationFrame(() => { el.style.width = pct + '%'; }); });
    });

    // ︙ボタンで残りを展開
    document.getElementById('votMoreBtn')?.addEventListener('click', () => {
      const wrap = document.getElementById('voteCollapseWrap');
      wrap.classList.add('is-open');
      // 展開後にバーアニメーション
      wrap.querySelectorAll('.vote-hidden-list .vote-stacked-seg').forEach((el, i) => {
        const pct = el.dataset.pct;
        el.style.width = '0%';
        el.style.transition = `width 0.75s cubic-bezier(.34,1.1,.64,1) ${i * 35}ms`;
        requestAnimationFrame(() => { requestAnimationFrame(() => { el.style.width = pct + '%'; }); });
      });
    });
    // ハイライトバーアニメーション
    document.querySelectorAll('.highlight-bar-seg').forEach((el, i) => {
      const pct = el.dataset.pct;
      el.style.width = '0%';
      el.style.transition = `width 0.7s cubic-bezier(.34,1.1,.64,1) ${150 + i*60}ms`;
      requestAnimationFrame(() => { requestAnimationFrame(() => { el.style.width = pct + '%'; }); });
    });

    // Xシェアボタン
    document.getElementById('btnXShare')?.addEventListener('click', () => {
      window.open(document.getElementById('btnXShare').dataset.url, '_blank');
    });
    // コピーボタン
    document.getElementById('btnCopyShare')?.addEventListener('click', async () => {
      const text = document.getElementById('btnCopyShare').dataset.text.replace(/&quot;/g, '"');
      await navigator.clipboard.writeText(text).catch(() => {});
      showToast('コピーしました！');
    });

    // ── STEP1: 画像保存ボタン ──
    document.getElementById('btnSaveImage')?.addEventListener('click', async () => {
      const btn = document.getElementById('btnSaveImage');
      const target = document.getElementById('typeHeroArea');
      if (!target) return;
      btn.disabled = true;
      btn.textContent = '生成中…';

      // html2canvas を CDN から動的ロード
      if (!window.html2canvas) {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
          s.onload = resolve; s.onerror = reject;
          document.head.appendChild(s);
        });
      }

      try {
        const canvas = await window.html2canvas(target, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: null,
          logging: false,
          width: target.offsetWidth,
          height: target.offsetHeight,
        });

        // PNG としてダウンロード
        const link = document.createElement('a');
        link.download = 'synestheshare.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('画像を保存しました');
      } catch (e) {
        console.warn('画像保存エラー:', e);
        showToast('画像の生成に失敗しました');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1v8M4 6l3 3 3-3M1 10v1a2 2 0 002 2h8a2 2 0 002-2v-1"/></svg> 画像を保存`;
      }
    });

    // ── STEP3: OGPメタタグをURLパラメータから動的書き換え ──
    // （GitHub Pages では bot がJSを実行しないため効果はSNSプレビューには出ないが
    //   将来 Cloudflare Workers に移行した際のロジック確認用として記録）
    (function updateOGP() {
      const p = new URLSearchParams(location.search);
      if (!p.get('r')) return;
      const typeHero = document.querySelector('.type-hero');
      const typeName = typeHero?.querySelector('.type-name-color')?.textContent?.trim() || '';
      const diagName = typeHero?.querySelector('.type-name-diag')?.textContent?.trim() || '';
      const desc = `${typeName} / ${diagName} — あなたの文字には、どんな色が見えますか？`;
      const url  = location.href;
      document.querySelector('meta[property="og:title"]')      ?.setAttribute('content', `${typeName} — SynestheShare`);
      document.querySelector('meta[property="og:description"]') ?.setAttribute('content', desc);
      document.querySelector('meta[property="og:url"]')         ?.setAttribute('content', url);
      document.querySelector('meta[name="twitter:title"]')      ?.setAttribute('content', `${typeName} — SynestheShare`);
      document.querySelector('meta[name="twitter:description"]')?.setAttribute('content', desc);
      document.title = `${typeName} — SynestheShare`;
    })();
  }, 500);
}

/* ══ アートカード描画 ══ */
function drawArtCanvas(typeId, canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.offsetWidth;
  const h = canvas.offsetHeight;
  if (!w || !h) return;
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const rng = (() => { let s = 42; return () => { s ^= s<<13; s ^= s>>17; s ^= s<<5; return (s>>>0)/4294967296; }; })();

  const art = {
    warm() {
      ctx.fillStyle = '#f5ede4'; ctx.fillRect(0,0,w,h);
      const g = ctx.createRadialGradient(w*0.75,h*0.2,0,w*0.75,h*0.2,w*0.9);
      g.addColorStop(0,'rgba(240,140,60,0.55)'); g.addColorStop(0.5,'rgba(224,80,40,0.28)'); g.addColorStop(1,'transparent');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      const g2 = ctx.createRadialGradient(w*0.1,h*0.85,0,w*0.1,h*0.85,w*0.6);
      g2.addColorStop(0,'rgba(255,180,60,0.45)'); g2.addColorStop(1,'transparent');
      ctx.fillStyle = g2; ctx.fillRect(0,0,w,h);
      for (let i=0;i<120;i++) {
        const x=rng()*w, y=rng()*h, r=rng()*2+0.5, a=rng()*0.5+0.1;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fillStyle = `rgba(255,${Math.floor(120+rng()*80)},${Math.floor(rng()*60)},${a})`; ctx.fill();
      }
      for (let i=0;i<6;i++) {
        const y=h*(0.2+i*0.13), x0=rng()*w*0.3;
        ctx.beginPath(); ctx.moveTo(x0,y);
        ctx.bezierCurveTo(w*0.3+rng()*w*0.1,y+rng()*60-30, w*0.7+rng()*w*0.1,y+rng()*60-30, w,y+rng()*40-20);
        ctx.strokeStyle=`rgba(220,80,20,${0.04+rng()*0.06})`; ctx.lineWidth=60+rng()*80; ctx.stroke();
      }
    },
    cool() {
      ctx.fillStyle = '#e8f0f8'; ctx.fillRect(0,0,w,h);
      const g = ctx.createRadialGradient(w*0.3,h*0.3,0,w*0.3,h*0.3,w*1.1);
      g.addColorStop(0,'rgba(24,136,200,0.45)'); g.addColorStop(0.6,'rgba(112,40,192,0.2)'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
      for (let i=0;i<8;i++) {
        const y = h*(i/8); const amp=20+rng()*30;
        ctx.beginPath();
        for (let x=0;x<=w;x+=2) { const yy=y+Math.sin(x/w*Math.PI*3+i)*amp; if(x===0)ctx.moveTo(x,yy); else ctx.lineTo(x,yy); }
        ctx.strokeStyle=`rgba(24,136,200,${0.04+rng()*0.07})`; ctx.lineWidth=1.5; ctx.stroke();
      }
      for (let i=0;i<80;i++) {
        const x=rng()*w,y=rng()*h,r=rng()*3+0.5;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fillStyle=`rgba(112,203,255,${0.2+rng()*0.4})`; ctx.fill();
      }
      const g2=ctx.createLinearGradient(0,h*0.6,0,h);
      g2.addColorStop(0,'transparent'); g2.addColorStop(1,'rgba(112,40,192,0.12)');
      ctx.fillStyle=g2; ctx.fillRect(0,0,w,h);
    },
    nature() {
      ctx.fillStyle = '#edf4e8'; ctx.fillRect(0,0,w,h);
      const g=ctx.createRadialGradient(w*0.6,h*0.4,0,w*0.6,h*0.4,w*0.9);
      g.addColorStop(0,'rgba(42,158,96,0.4)'); g.addColorStop(0.5,'rgba(168,208,32,0.2)'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
      for (let i=0;i<200;i++) {
        const x=rng()*w, y=rng()*h;
        const len=4+rng()*12, angle=(-Math.PI/2)+rng()*0.6-0.3;
        ctx.beginPath();
        ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(angle)*len, y+Math.sin(angle)*len);
        ctx.strokeStyle=`rgba(${Math.floor(42+rng()*60)},${Math.floor(120+rng()*80)},${Math.floor(20+rng()*40)},${0.12+rng()*0.18})`;
        ctx.lineWidth=0.8+rng(); ctx.stroke();
      }
      const g2=ctx.createRadialGradient(w*0.1,h*0.9,0,w*0.1,h*0.9,w*0.5);
      g2.addColorStop(0,'rgba(168,208,32,0.3)'); g2.addColorStop(1,'transparent');
      ctx.fillStyle=g2; ctx.fillRect(0,0,w,h);
    },
    mono() {
      ctx.fillStyle = '#f0f0ee'; ctx.fillRect(0,0,w,h);
      for (let i=0;i<12;i++) {
        const y=h*(i/12), v=0.02+rng()*0.05;
        ctx.fillStyle=`rgba(0,0,0,${v})`; ctx.fillRect(0,y,w,h/12);
      }
      const g=ctx.createRadialGradient(w*0.5,h*0.4,0,w*0.5,h*0.4,w*0.8);
      g.addColorStop(0,'rgba(24,24,24,0.18)'); g.addColorStop(0.4,'rgba(136,136,128,0.12)'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
      for (let i=0;i<300;i++) {
        const x=rng()*w, y=rng()*h;
        const s=rng()*3; const a=rng()*0.12;
        ctx.fillStyle=`rgba(0,0,0,${a})`; ctx.fillRect(x,y,s,s);
      }
      for (let i=0;i<5;i++) {
        const x=rng()*w, r=w*0.1+rng()*w*0.3;
        ctx.beginPath(); ctx.arc(x,h*0.5,r,0,Math.PI*2);
        ctx.strokeStyle=`rgba(0,0,0,${0.03+rng()*0.04})`; ctx.lineWidth=1; ctx.stroke();
      }
    },
    pastel() {
      ctx.fillStyle = '#fdf0f5'; ctx.fillRect(0,0,w,h);
      const cols=['rgba(255,144,184,0.4)','rgba(112,203,255,0.35)','rgba(255,220,240,0.5)','rgba(200,220,255,0.35)'];
      for (let i=0;i<6;i++) {
        const x=rng()*w,y=rng()*h,r=w*(0.2+rng()*0.4);
        const g=ctx.createRadialGradient(x,y,0,x,y,r);
        g.addColorStop(0,cols[Math.floor(rng()*cols.length)]); g.addColorStop(1,'transparent');
        ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
      }
      for (let i=0;i<60;i++) {
        const x=rng()*w,y=rng()*h,r=1+rng()*4;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,144,184,${0.15+rng()*0.3})`; ctx.fill();
      }
      const g2=ctx.createLinearGradient(0,0,w,h);
      g2.addColorStop(0,'rgba(255,255,255,0.3)'); g2.addColorStop(0.5,'transparent'); g2.addColorStop(1,'rgba(200,180,255,0.2)');
      ctx.fillStyle=g2; ctx.fillRect(0,0,w,h);
    },
    neon() {
      ctx.fillStyle = '#f0eef8'; ctx.fillRect(0,0,w,h);
      const pairs=[['rgba(224,58,42,0.5)','rgba(112,40,192,0.4)'],['rgba(232,120,32,0.3)','rgba(24,136,200,0.35)']];
      pairs.forEach(([c1,c2],i)=>{
        const x1=rng()*w,y1=rng()*h,x2=w-rng()*w*0.5,y2=h-rng()*h*0.4;
        const g=ctx.createLinearGradient(x1,y1,x2,y2);
        g.addColorStop(0,c1); g.addColorStop(1,c2);
        ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
        if(i<1){const g2=ctx.createRadialGradient(w*0.8,h*0.15,0,w*0.8,h*0.15,w*0.5); g2.addColorStop(0,'rgba(112,40,192,0.35)'); g2.addColorStop(1,'transparent'); ctx.fillStyle=g2; ctx.fillRect(0,0,w,h);}
      });
      for (let i=0;i<150;i++) {
        const x=rng()*w,y=rng()*h,r=0.5+rng()*2.5;
        const bright=rng()>0.5;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fillStyle=bright?`rgba(255,220,80,${0.3+rng()*0.5})`:`rgba(255,255,255,${0.15+rng()*0.35})`; ctx.fill();
      }
      for (let i=0;i<4;i++) {
        const x1=rng()*w,y1=rng()*h,x2=rng()*w,y2=rng()*h;
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
        ctx.strokeStyle=`rgba(255,${Math.floor(rng()*100)},${Math.floor(rng()*200)},${0.08+rng()*0.1})`; ctx.lineWidth=30+rng()*60; ctx.stroke();
      }
    },
    dream() {
      ctx.fillStyle = '#f0eaf8'; ctx.fillRect(0,0,w,h);
      const g=ctx.createRadialGradient(w*0.4,h*0.35,0,w*0.4,h*0.35,w*1.0);
      g.addColorStop(0,'rgba(176,96,232,0.45)'); g.addColorStop(0.5,'rgba(112,40,192,0.22)'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
      const g2=ctx.createRadialGradient(w*0.8,h*0.75,0,w*0.8,h*0.75,w*0.6);
      g2.addColorStop(0,'rgba(255,144,184,0.38)'); g2.addColorStop(1,'transparent');
      ctx.fillStyle=g2; ctx.fillRect(0,0,w,h);
      for (let i=0;i<100;i++) {
        const x=rng()*w,y=rng()*h,r=0.5+rng()*3.5,a=rng()*0.6+0.1;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fillStyle=rng()>0.4?`rgba(176,96,232,${a})`:`rgba(255,144,184,${a})`; ctx.fill();
      }
      for (let i=0;i<5;i++) {
        const x=w*(0.1+rng()*0.8),y=h*(0.1+rng()*0.8),r=w*(0.08+rng()*0.18);
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
        ctx.strokeStyle=`rgba(176,96,232,${0.04+rng()*0.06})`; ctx.lineWidth=1; ctx.stroke();
      }
      const gv=ctx.createLinearGradient(0,0,0,h);
      gv.addColorStop(0,'transparent'); gv.addColorStop(1,'rgba(112,40,192,0.1)');
      ctx.fillStyle=gv; ctx.fillRect(0,0,w,h);
    },
    earth() {
      ctx.fillStyle = '#f0ece4'; ctx.fillRect(0,0,w,h);
      const g=ctx.createRadialGradient(w*0.65,h*0.3,0,w*0.65,h*0.3,w*0.9);
      g.addColorStop(0,'rgba(192,120,64,0.4)'); g.addColorStop(0.6,'rgba(139,69,19,0.2)'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
      const g2=ctx.createRadialGradient(w*0.15,h*0.8,0,w*0.15,h*0.8,w*0.55);
      g2.addColorStop(0,'rgba(42,158,96,0.32)'); g2.addColorStop(1,'transparent');
      ctx.fillStyle=g2; ctx.fillRect(0,0,w,h);
      for (let i=0;i<8;i++) {
        const y=h*(0.1+i*0.12);
        ctx.beginPath(); ctx.moveTo(0,y+rng()*20-10);
        for (let x=0;x<=w;x+=8) {
          ctx.lineTo(x,y+Math.sin(x/90+i)*12+rng()*6-3);
        }
        ctx.strokeStyle=`rgba(${Math.floor(100+rng()*60)},${Math.floor(50+rng()*40)},${Math.floor(10+rng()*20)},${0.05+rng()*0.06})`;
        ctx.lineWidth=20+rng()*30; ctx.stroke();
      }
      for (let i=0;i<80;i++) {
        const x=rng()*w,y=rng()*h,r=0.5+rng()*2;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fillStyle=`rgba(139,69,19,${0.1+rng()*0.18})`; ctx.fill();
      }
    },
  };

  (art[typeId] || art.warm)();

  const vignette=ctx.createRadialGradient(w/2,h/2,h*0.2,w/2,h/2,w*0.85);
  vignette.addColorStop(0,'transparent'); vignette.addColorStop(1,'rgba(0,0,0,0.08)');
  ctx.fillStyle=vignette; ctx.fillRect(0,0,w,h);

  canvas.classList.add('is-ready');
}

<!-- ══ Firebase 投票・集計ロジック ══ -->
<script type="module">
import { initializeApp }                          from 'firebase/app';
import { getFirestore, doc, getDoc, setDoc,
         updateDoc, increment, collection,
         addDoc, serverTimestamp }                from 'firebase/firestore';

/* ── Firebase 設定（firebase-config.js の値をここに貼る） ── */
const firebaseConfig = {
  apiKey:            "AIzaSyDsH54o6q3UBGD6Cu6OjcTg4cMvRF5_5nc",
  authDomain:        "synestheshare.firebaseapp.com",
  projectId:         "synestheshare",
  storageBucket:     "synestheshare.firebasestorage.app",
  messagingSenderId: "164018072977",
  appId:             "1:164018072977:web:06cfe6e3520d8f66ecbe30",
};

/* ────────────────────────────────────────────────
   色ID → hex 変換（result.html既存の定数と同じ）
──────────────────────────────────────────────── */
const COLOR_HEX = {
  '0':'#e03a2a','1':'#e87820','2':'#f0e040','3':'#a8d020',
  '4':'#2a9e60','5':'#1888c8','6':'#70cbff','7':'#7028c0',
  '8':'#ff90b8','9':'#8b4513','A':'#181818','B':'#888880','C':'#ffffff',
};
const COLOR_NAME = {
  '#e03a2a':'赤','#e87820':'橙','#f0e040':'黄','#a8d020':'黄緑',
  '#2a9e60':'緑','#1888c8':'青','#70cbff':'水色','#7028c0':'紫',
  '#ff90b8':'ピンク','#8b4513':'茶色','#181818':'黒','#888880':'グレー','#ffffff':'白',
};

/* ────────────────────────────────────────────────
   URLパラメータから選択色を復元
──────────────────────────────────────────────── */
function parseColorMap() {
  const params = new URLSearchParams(location.search);
  const r = params.get('r') || '';
  const mode = params.get('mode') || '10';
  const letters = mode === '26'
    ? 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')
    : ['A','B','C','D','E','F','G','X','Y','Z'];
  const map = {};
  letters.forEach((l, i) => {
    const id = r[i];
    if (id && COLOR_HEX[id]) map[l] = COLOR_HEX[id];
  });
  return map;
}

/* ────────────────────────────────────────────────
   投票すべきか判定
   ・alphabet.htmlから来た（sessionStorage に ss_from_alphabet=1）
   ・かつ、この結果でまだ投票していない（ss_vote_key が未完）
──────────────────────────────────────────────── */
function shouldVote() {
  const fromAlphabet = sessionStorage.getItem('ss_from_alphabet') === '1';
  if (!fromAlphabet) return false;
  const voteKey = sessionStorage.getItem('ss_vote_key');
  if (!voteKey) return false;
  if (sessionStorage.getItem(voteKey) === 'done') return false;
  return true;
}

function markVoteDone() {
  const voteKey = sessionStorage.getItem('ss_vote_key');
  if (voteKey) sessionStorage.setItem(voteKey, 'done');
  sessionStorage.removeItem('ss_from_alphabet');
  localStorage.setItem('ss_submitted', '1'); // 同ブラウザからの再投票を永続ブロック
}

/* ────────────────────────────────────────────────
   色名 → hex の逆引きマップ
──────────────────────────────────────────────── */
const NAME_TO_HEX = Object.fromEntries(
  Object.entries(COLOR_NAME).map(([hex, name]) => [name, hex])
);

/* ────────────────────────────────────────────────
   統計ドキュメントを votes 形式に変換
   Firestore: statistics/{letter} = { "赤": 120, "青": 50, ... }
──────────────────────────────────────────────── */
function statsToVotes(statsData) {
  const votes = {};
  Object.entries(statsData).forEach(([letter, colorCounts]) => {
    const total = Object.values(colorCounts).reduce((s, n) => s + n, 0);
    if (total === 0) return;
    votes[letter] = Object.entries(colorCounts)
      .sort((a, b) => b[1] - a[1])
      .map(([name, count]) => ({
        color: NAME_TO_HEX[name] || name,
        name,
        pct: Math.round(count / total * 100),
      }));
  });
  return votes;
}

/* ────────────────────────────────────────────────
   MAIN
──────────────────────────────────────────────── */
(async () => {
  /* Firebase が設定されていなければ静かにスキップ */
  if (firebaseConfig.apiKey === 'YOUR_API_KEY') {
    console.info('[SynestheShare] Firebase未設定のためスキップ');
    return;
  }

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const colorMap = parseColorMap();
  const letters  = Object.keys(colorMap);
  if (letters.length === 0) return;

  /* ── STEP 1: 投票を保存（alphabet→result の直接遷移時のみ） ── */
  if (shouldVote()) {
    try {
      /* responses コレクションに1件追加 */
      await addDoc(collection(db, 'responses'), {
        r:         new URLSearchParams(location.search).get('r') || '',
        mode:      new URLSearchParams(location.search).get('mode') || '10',
        timestamp: serverTimestamp(),
      });

      /* statistics/{letter} に各色の票数をインクリメント（キー=色名） */
      const updates = letters.map(async l => {
        const hex = colorMap[l];
        if (!hex) return;
        const colorName = COLOR_NAME[hex] || hex;
        const ref = doc(db, 'statistics', l);
        try {
          await updateDoc(ref, { [colorName]: increment(1) });
        } catch {
          await setDoc(ref, { [colorName]: 1 });
        }
      });
      await Promise.all(updates);

      markVoteDone();
      console.info('[SynestheShare] 投票完了');
    } catch (e) {
      console.warn('[SynestheShare] 投票エラー:', e);
    }
  }

  /* ── STEP 2: 統計データを取得してUIを更新 ── */
  try {
    const allLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const fetches = allLetters.map(l => getDoc(doc(db, 'statistics', l)));
    const snaps   = await Promise.all(fetches);

    const statsData = {};
    allLetters.forEach((l, i) => {
      if (snaps[i].exists()) statsData[l] = snaps[i].data();
    });

    const hasData = Object.keys(statsData).length > 0;
    if (!hasData) {
      console.info('[SynestheShare] 統計データなし（まだ誰も投票していない）');
      return;
    }

    const liveVotes = statsToVotes(statsData);

    /* グローバルの DUMMY_VOTES をリアルデータで上書き */
    if (typeof window.DUMMY_VOTES !== 'undefined') {
      Object.assign(window.DUMMY_VOTES, liveVotes);
    }

    /* result画面を再描画 */
    if (typeof window.render === 'function') {
      window.render();
    }

    console.info('[SynestheShare] リアルデータで更新完了');
  } catch (e) {
    console.warn('[SynestheShare] 統計取得エラー（ダミーデータで表示）:', e);
  }
})();
</script>
