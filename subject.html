<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ファビコン -->
<link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/favicon-180.png">
<meta property="og:type"        content="website">
<meta property="og:site_name"   content="SynestheShare">
<meta property="og:title"       content="教科診断 — SynestheShare">
<meta property="og:description" content="教科に色を割り当てて、あなただけの共感覚パレットを作ろう。">
<meta property="og:url"         content="">
<meta property="og:image"       content="">
<meta name="twitter:card"       content="summary_large_image">
<meta name="twitter:title"      content="教科診断 — SynestheShare">
<meta name="twitter:description" content="教科に色を割り当てて、あなただけの共感覚パレットを作ろう。">
<script>
(function() {
  document.querySelector('meta[property="og:url"]')  ?.setAttribute('content', location.href);
  document.querySelector('meta[property="og:image"]') ?.setAttribute('content', `${location.origin}/ogp.png`);
  document.querySelector('meta[name="twitter:image"]') || (() => {
    const m = document.createElement('meta');
    m.name = 'twitter:image'; m.content = `${location.origin}/ogp.png`;
    document.head.appendChild(m);
  })();
})();
</script>
<title>教科診断 — SynestheShare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --white:  #fffdf9;
  --bg:     #f7f7f5;
  --ink:    #2b2d38;
  --ink2:   #555550;
  --ink3:   #aaaaaa;
  --border: #e0e0dc;
  --c1: #ff7f7f;
  --c2: #ffae66;
  --c3: #d4b800;
  --c4: #67bf92;
  --c5: #4da8e8;
  --c6: #9272ff;
  --c7: #d8306a;
  --mint: #1aaeaa;
  --outfit: 'Outfit', sans-serif;
  --jp: 'Noto Sans JP', "HiraginoUDSansN-W3", "ヒラギノUD角ゴ ProN W3",
        "Hiragino Sans", "ヒラギノ角ゴシック",
        "Meiryo UI", "Meiryo", sans-serif;
}

html { scroll-behavior: smooth; }
body {
  background-image: url('assets/backgrounds/alphabet.webp');
  background-size: cover;
  background-position: center top;
  background-attachment: fixed;
  color: var(--ink); font-family: var(--jp); overflow-x: hidden; line-height: 1.6;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}

/* wbr対応 */
h1, h2, h3, p, .page-title, .page-lead,
.picker-title, .hint, .result-title, .result-meta,
nav ul a, .page-eyebrow, .page-breadcrumb {
  word-break: keep-all; overflow-wrap: break-word;
}

/* ══════════════════════════════════════
   NAV
══════════════════════════════════════ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 54px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 1.5rem;
  background: rgba(247,247,245,0.88);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(224,224,220,0.7);
}
.nav-logo {
  position: absolute; left: 1.5rem;
  display: flex; align-items: center; text-decoration: none; height: 26px;
}
.nav-logo img { height: 100%; width: auto; display: block; }
.nav-right { position: absolute; right: 1.5rem; }
nav ul { list-style: none; display: flex; gap: 1.8rem; }
nav ul a { color: var(--ink2); text-decoration: none; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.04em; transition: color 0.15s; font-family: var(--jp); }
nav ul a:hover { color: var(--ink); }
.nav-back {
  font-family: var(--outfit); font-size: 0.72rem; font-weight: 600;
  letter-spacing: 0.1em; color: var(--ink3);
  text-decoration: none; display: flex; align-items: center; gap: 0.35rem;
  transition: color 0.15s;
}
.nav-back:hover { color: var(--ink); }

.btn-primary, .nav-cta {
  background: rgba(220,50,32,0.88);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  border: 1.5px solid rgba(255,255,255,0.22);
  border-radius: 100px; color: #fff;
  font-family: var(--jp); font-weight: 700;
  text-decoration: none; letter-spacing: 0.04em;
  transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
  display: inline-flex; align-items: center; gap: 0.4rem;
  white-space: nowrap;
  box-shadow: 0 4px 18px rgba(220,50,32,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
}
.btn-primary { padding: 0.82rem 1.85rem; font-size: 0.9rem; }
.nav-cta     { padding: 0.48rem 1.25rem; font-size: 0.82rem; }
.btn-primary:hover, .nav-cta:hover {
  background: rgba(200,35,18,0.96); transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(220,50,32,0.45), inset 0 1px 0 rgba(255,255,255,0.18);
}

/* ══════════════════════════════════════
   パンくず（HERO内・absolute）
══════════════════════════════════════ */
.breadcrumb-bar {
  position: absolute;
  top: calc(5rem - 0.4rem); /* nav高さ分 - 少し上 */
  left: 2.5rem;
  z-index: 2;
}
.breadcrumb-bar .page-breadcrumb {
  font-family: var(--outfit); font-size: 0.68rem; font-weight: 600;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  display: flex; align-items: center; gap: 0.45rem;
  text-decoration: none; transition: color 0.15s;
}
.breadcrumb-bar .page-breadcrumb::before { content: '←'; }
.breadcrumb-bar .page-breadcrumb:hover { color: rgba(255,255,255,0.8); }

@media (max-width: 600px) {
  .breadcrumb-bar { left: 1.25rem; }
}

/* ══════════════════════════════════════
   PAGE HERO (診断ページ用コンパクト版)
══════════════════════════════════════ */
.page-hero-wrap {
  position: relative;
  padding-top: 6.5rem;
  background: transparent;
}
.page-blob { display: none; }
.main-blob  { display: none; }
.page-blob-1 {
  width: max(480px, 80vw); height: max(480px, 80vw);
  top: -25%; left: -12%;
  animation: blobdrift 9s ease-in-out infinite alternate;
}
.page-blob-2 {
  width: max(360px, 60vw); height: max(360px, 60vw);
  top: 5%; right: -15%;
  animation: blobdrift 12s ease-in-out infinite alternate-reverse;
}
.page-blob-3 {
  width: max(300px, 50vw); height: max(300px, 50vw);
  bottom: -10%; left: 30%;
  animation: blobdrift 10s ease-in-out infinite alternate;
}
@keyframes blobdrift {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(24px,18px) scale(1.06); }
}

.page-hero {
  position: relative; z-index: 1;
  max-width: 900px; margin: 0 auto;
  padding: 3.5rem 1rem 2.5rem;
  display: flex; flex-direction: column; align-items: center; gap: .75rem;
  text-align: center;
}
.page-eyebrow {
  font-family: var(--outfit); font-size: 0.72rem; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink3);
  display: flex; align-items: center; gap: 0.6rem;
}
.page-eyebrow::before { content: ''; display: block; width: 24px; height: 1px; background: var(--ink3); }

.page-title {
  font-family: var(--jp); font-weight: 340;
  font-size: clamp(2rem, 4.5vw, 3.2rem);
  line-height: 1.2; letter-spacing: -0.01em;
  word-break: keep-all; overflow-wrap: break-word;
}
/* Position the alphabet intro without moving the progress bar. */
.page-title:first-child { margin-block-start: -.1rem; }
.page-title:first-child:lang(ja) { translate: .22em 0; }
.page-title:first-child + .page-lead { margin-block-end: 2rem; }
.page-title strong { font-weight: 340; }
.page-title .hl-red  { color: var(--c1); font-weight: 340; }

.page-lead {
  font-size: 0.88rem; color: var(--ink2); line-height: 1.85;
  max-width: 480px; font-weight: 340;
  word-break: keep-all; overflow-wrap: break-word;
}

.progress-bar-wrap {
  width: min(100%, 42rem);
  margin: 0 auto;
  padding: 0 1rem 2rem;
  position: relative; z-index: 1;
}
.progress-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 0.5rem;
}
.progress-label { font-family: var(--outfit); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; color: var(--ink3); text-transform: uppercase; }
.progress-count { font-family: var(--outfit); font-size: 0.8rem; font-weight: 700; color: var(--ink2); }
.progress-count span { color: var(--c1); }
.progress-track {
  height: 4px;
  background: rgba(255,255,255,0.10);
  border-radius: 100px;
}
.progress-fill {
  height: 100%; border-radius: 100px;
  background: linear-gradient(90deg, var(--c1), var(--c2)); /* 初期値、JS側で上書き */
  transition: width 0.4s cubic-bezier(.34,1.56,.64,1), background 0.6s ease;
  position: relative; overflow: hidden;
  box-shadow: 0 0 8px rgba(180,220,255,0.40), 0 0 2px rgba(255,255,255,0.45);
  width: 0%;
}
.progress-fill::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,0.30) 50%,
    transparent 100%
  );
  animation: progressShimmer 2.4s ease-in-out infinite;
}
@keyframes progressShimmer {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}

/* ══════════════════════════════════════
   メインコンテンツ
══════════════════════════════════════ */
.main-outer {
  position: relative;
  background: transparent;
  isolation: isolate;
  flex: 1;
}
/* 空気の膜：UI背後だけ静かに落ち着かせる */
.main-outer::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(8,10,20,0.266),
    rgba(8,10,20,0.620)
  );
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  pointer-events: none;
  z-index: 0;
}
/* ABOUTセクション風blob */
.main-blob { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
.main-blob-1 {
  width: min(520px, 55vw); height: min(520px, 55vw);
  background: radial-gradient(circle, rgba(26,174,170,0.18) 0%, transparent 70%);
  top: -10%; right: -5%;
  animation: blobdrift 10s ease-in-out infinite alternate;
}
.main-blob-2 {
  width: min(400px, 42vw); height: min(400px, 42vw);
  background: radial-gradient(circle, rgba(112,40,192,0.14) 0%, transparent 70%);
  bottom: 5%; left: -5%;
  animation: blobdrift 13s ease-in-out infinite alternate-reverse;
}
.main-blob-3 {
  width: min(350px, 38vw); height: min(350px, 38vw);
  background: radial-gradient(circle, rgba(232,120,32,0.13) 0%, transparent 70%);
  top: 40%; left: 30%;
  animation: blobdrift 11s ease-in-out infinite alternate;
}
.main-wrap {
  position: relative; z-index: 1;
  max-width: 900px; margin: 0 auto;
  padding: 3rem 1rem 0;
}

/* ── モードトグル ── */
.mode-toggle-row {
  display: flex; justify-content: center;
  margin-top: 1.65rem;
}
.btn-mode-toggle {
  min-height: 44px;
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: .35rem .5rem;
  border: 0; background: transparent;
  cursor: pointer; font-family: var(--jp); font-size: 0.78rem; font-weight: 700;
  color: rgba(255,255,255,0.85); transition: color 0.15s;
}
.btn-mode-toggle:hover { color: #fffdf9; }
.btn-mode-toggle-icon { font-size: 0.9rem; }

/* ── 教科グリッド ── */
.alpha-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: clamp(8px, 2.6vw, 12px);
}
/* 10文字モード時のグリッド幅制限 */
.alpha-grid.mode-10 {
  width: min(100%, 21.75rem);
  margin-left: auto; margin-right: auto;
}
/* 26文字モード: 最終行も中央揃え */
.alpha-grid.mode-26 {
  --alpha-columns: 6;
  --alpha-gap: 10px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--alpha-gap);
  max-width: 100%;
  margin-inline: auto;
}
.alpha-grid.mode-26 .alpha-cell {
  flex: 0 0 calc((100% - (var(--alpha-columns) - 1) * var(--alpha-gap)) / var(--alpha-columns));
}
/* PC：円を少し小さく */
@media (min-width: 641px) {
  .alpha-grid.mode-26 { max-width: 440px; }
}

/* 正円 padding-topトリック */
.alpha-cell { position: relative; cursor: pointer; }
.alpha-cell::before { content: ''; display: block; padding-top: 100%; }
.alpha-bubble {
  position: absolute; inset: 0;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--outfit); font-weight: 700;
  transition: transform 0.28s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
  overflow: hidden;
  /* 初期: アウトライン */
  background: var(--white);
  border: 2.5px solid var(--border);
}
.alpha-bubble span { display: block; line-height: 1; text-align: center; white-space: nowrap; color: var(--ink3); }
.alpha-cell:hover .alpha-bubble { transform: scale(1.08); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
.alpha-cell.selected .alpha-bubble { border-width: 0; }
.alpha-cell.selected .alpha-bubble span { color: white; }

/* ── カラーピッカーパネル ── */
.picker-panel {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
  pointer-events: none;
  /* opacityをpanelにかけない → backdropのblur遅延を防ぐ */
}
.picker-panel.active { pointer-events: auto; }

.picker-backdrop {
  position: absolute; inset: 0;
  background: rgba(24,24,24,0.32);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 0.22s ease;
}
.picker-panel.active .picker-backdrop { opacity: 1; }

.picker-sheet {
  position: relative; z-index: 1;
  overflow: hidden;
  background: rgba(18,18,26,0.72);
  backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 20px 20px 0 0;
  padding: 1.5rem 1.75rem 2.5rem;
  width: 100%; max-width: 520px;
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(.34,1.4,.64,1);
  box-shadow: 0 -8px 40px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.10);
}
.picker-sheet::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    150deg,
    rgba(255,255,255,0.10) 0%,
    rgba(255,255,255,0.04) 30%,
    transparent 60%
  );
  pointer-events: none;
  z-index: -1;
}
.picker-panel.active .picker-sheet { transform: translateY(0); }

.picker-handle {
  width: 36px; height: 4px; border-radius: 100px;
  background: rgba(255,255,255,0.22); margin: 0 auto 1.25rem;
}
.picker-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.25rem;
}
.picker-letter-preview {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--outfit); font-weight: 700; font-size: 1.5rem;
  transition: background 0.2s, box-shadow 0.2s, border-color 0.2s;
  position: relative; isolation: isolate;
  color: rgba(255,255,255,0.72);
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.45);
  box-shadow:
    0 0 10px rgba(255,255,255,0.18),
    0 0 24px rgba(180,220,255,0.14),
    inset 0 0 10px rgba(255,255,255,0.08);
}
.picker-letter-preview::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    150deg,
    rgba(255,255,255,0.62) 0%,
    rgba(255,255,255,0.32) 22%,
    rgba(255,255,255,0.10) 42%,
    transparent 65%
  );
  pointer-events: none;
  z-index: -1;
}
/* 透明色選択時：::before を非表示にして未選択円と同じ外観に */
.picker-letter-preview.is-empty::before {
  display: none;
}
.picker-title { font-family: var(--jp); font-weight: 700; font-size: 1rem; color: rgba(255,255,255,0.92); }
.picker-subtitle { display: block; font-size: 0.75rem; color: #fffdf9; font-weight: 300; margin-top: 0.1rem; }
.picker-close {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.20);
  background: rgba(255,255,255,0.06); cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.55); font-size: 1.1rem; transition: background 0.15s, color 0.15s;
}
.picker-close:hover { background: rgba(255,255,255,0.14); color: rgba(255,255,255,0.9); }

/* プリセットカラースウォッチ */
.swatches-section { margin-bottom: 1.25rem; }
.swatches {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
}
.swatch {
  width: 100%; aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), border-color 0.15s;
}
.swatch:hover { transform: scale(1.15); }
.swatch.active { border-color: rgba(255,255,255,0.88); transform: scale(1.1); }

/* 「色なし」スウォッチ：alphabet 未選択円と同じダークガラス */
.swatch-none {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.45) !important;
  box-shadow:
    0 0 8px rgba(255,255,255,0.15),
    inset 0 0 8px rgba(255,255,255,0.06);
  position: relative;
}

/* カスタムカラー */
.custom-section { display: flex; align-items: center; gap: 0.75rem; }
.custom-label { font-family: var(--outfit); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.45); white-space: nowrap; }
.color-input-wrap { position: relative; flex: 1; }
.color-input-wrap input[type="color"] {
  width: 100%; height: 40px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.18); cursor: pointer;
  padding: 3px 6px; background: rgba(255,255,255,0.08);
  font-family: var(--outfit);
}
.picker-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
.btn-clear {
  flex: 1; padding: 0.7rem; border-radius: 100px;
  border: 1px solid rgba(255,255,255,0.20); background: rgba(255,255,255,0.06); cursor: pointer;
  font-family: var(--jp); font-size: 0.82rem; font-weight: 400; color: rgba(255,255,255,0.70);
  transition: background 0.15s, color 0.15s;
}
.btn-clear:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.9); }
.btn-decide {
  flex: 2; padding: 0.7rem; border-radius: 100px;
  border: 1px solid rgba(255,255,255,0.28); cursor: pointer;
  font-family: var(--jp); font-size: 0.82rem; font-weight: 400; color: #fff;
  background: rgba(255,90,90,0.88);
  backdrop-filter: blur(10px) saturate(140%); -webkit-backdrop-filter: blur(10px) saturate(140%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.28);
  transition: background 0.3s ease, transform 0.3s ease;
  letter-spacing: 0.04em;
}
.btn-decide:hover { background: rgba(255,105,95,0.94); transform: translateY(-2px); }

/* ── 結果パレット ── */
.result-section {
  padding-top: 2.5rem;
  padding-bottom: 2rem;
}
.alpha-grid + .result-section { padding-top: 5rem; }
@media (max-width: 600px), (hover: none) and (pointer: coarse) {
  .result-section { padding-bottom: calc(7rem + env(safe-area-inset-bottom, 0px)); }
}
.result-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;
}
.result-title { font-family: var(--jp); font-weight: 340; font-size: 1rem; color: rgba(255,255,255,0.92); }
.result-meta { font-family: var(--outfit); font-size: 0.72rem; color: var(--ink3); letter-spacing: 0.06em; }

.result-palette {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 2rem;
}
.palette-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  flex-shrink: 0;
}
.palette-dot {
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid var(--border);

<script>
/* ══ 定数 ══ */
const LETTER_LABELS = {"language":"国語","math":"数学","science":"理科","social":"社会","english":"英語"};
const BUBBLE_LABELS = { language:"国", math:"数", science:"理", social:"社", english:"英" };
const LETTERS_10 = Object.keys(LETTER_LABELS);
const PRESET_COLORS = [
  '#ff7f7f', // 赤
  '#ffae66', // 橙
  '#f5dc72', // 黄
  '#a8d85c', // 黄緑
  '#67bf92', // 緑
  '#4da8e8', // 青
  '#8edfff', // 水色
  '#9272ff', // 紫
  '#ee9fd0', // ピンク
  '#9f6f4f', // 茶色
  '#2b2d38', // 黒
  '#9698a8', // グレー
  '#fffdf9', // 白
];
const PRESET_LABELS = ['赤','橙','黄','黄緑','緑','青','水色','紫','ピンク','茶色','黒','グレー','白'];

/* ══ 状態 ══ */
let colorMap = {};
let activeLetter = null;
let pendingColor = null;

/* ── 起動時にURLから復元 ── */
(function restoreFromURL() {
  const params = new URLSearchParams(location.search);
  const rParam = params.get('r');
  const modeParam = params.get('mode');

  if (!rParam) {
    // Preserve choices from the previous number page's per-digit color URLs.
    for (const digit of LETTERS_10) {
      const value = params.get(digit) || params.get(LETTER_LABELS[digit]);
      if (!/^#[0-9a-f]{6}$/i.test(value || '')) continue;
      const rgb = hex => [1,3,5].map(offset => parseInt(hex.slice(offset,offset+2),16));
      const selected = rgb(value);
      colorMap[digit] = PRESET_COLORS.slice().sort((a,b) => {
        const distance = hex => rgb(hex).reduce((sum,channel,i) => sum + (channel-selected[i]) ** 2,0);
        return distance(a)-distance(b);
      })[0];
    }
  }
  if (rParam) {
    const letters = LETTERS_10;
    letters.forEach((l, i) => {
      const id = rParam[i];
      if (!id || id === '-') return;
      const idx = '0123456789ABC'.indexOf(id);
      if (idx >= 0 && PRESET_COLORS[idx]) colorMap[l] = PRESET_COLORS[idx];
    });
  }
})();

/* ══ DOM参照 ══ */
const alphaGrid       = document.getElementById('alphaGrid');
const pickerPanel     = document.getElementById('pickerPanel');
const pickerBackdrop  = document.getElementById('pickerBackdrop');
const pickerPreview   = document.getElementById('pickerPreview');
const pickerTitle     = document.getElementById('pickerTitle');
const pickerClose     = document.getElementById('pickerClose');
const swatchesEl      = document.getElementById('swatches');
const btnClear        = document.getElementById('btnClear');
const btnDecide       = document.getElementById('btnDecide');
const progressFill    = document.getElementById('progressFill');
const doneCount       = document.getElementById('doneCount');
const resultPalette   = document.getElementById('resultPalette');
const resultMeta      = document.getElementById('resultMeta');
const btnResult       = document.getElementById('btnResult');
const btnReset        = document.getElementById('btnReset');
const toastEl         = document.getElementById('toast');
const progressCountEl = document.querySelector('.progress-count');

/* ══ グリッド構築 ══ */
function buildGrid() {
  alphaGrid.innerHTML = '';
  const letters = LETTERS_10;
  alphaGrid.className = 'alpha-grid mode-10';

  letters.forEach(l => {
    const cell = document.createElement('div');
    cell.className = 'alpha-cell';
    cell.dataset.letter = l;
    cell.innerHTML = `<div class="alpha-bubble"><span lang="ja" title="${LETTER_LABELS[l]}">${BUBBLE_LABELS[l]}</span></div>`;
    cell.addEventListener('click', () => openPicker(l));
    alphaGrid.appendChild(cell);
    // appendChild後に色を反映（DOM挿入後でないとquerySelectorが効かない）
    if (colorMap[l]) applyColor(l, colorMap[l]);
  });

  syncFontSize();
}

/* ══ モード切替 ══ */


/* ══ フォントサイズ同期（正円トリック対応） ══ */
function syncFontSize() {
  document.querySelectorAll('.alpha-cell').forEach(cell => {
    const bubble = cell.querySelector('.alpha-bubble');
    const d = bubble.offsetWidth;
    if (d > 0) bubble.querySelector('span').style.fontSize = (d * 0.36) + 'px';
  });
}
new ResizeObserver(syncFontSize).observe(alphaGrid);
requestAnimationFrame(() => { syncFontSize(); requestAnimationFrame(() => { syncFontSize(); setTimeout(syncFontSize, 100); setTimeout(syncFontSize, 400); }); });
window.addEventListener('load', () => { syncFontSize(); setTimeout(syncFontSize, 200); });

/* ══ ピッカー: スウォッチ生成 ══ */
// 「色なし」スウォッチ
const noneEl = document.createElement('div');
noneEl.className = 'swatch swatch-none';
noneEl.title = '色なし';
noneEl.addEventListener('click', () => selectPendingColor(null));
swatchesEl.appendChild(noneEl);

PRESET_COLORS.forEach((c, i) => {
  const s = document.createElement('div');
  s.className = 'swatch';
  s.style.background = c;
  if (c === '#fffdf9') s.style.border = '2px solid var(--border)';
  s.title = PRESET_LABELS[i];
  s.addEventListener('click', () => selectPendingColor(c));
  swatchesEl.appendChild(s);
});

function selectPendingColor(color) {
  pendingColor = color;
  updatePickerPreview(color);
  // スウォッチのactive更新
  swatchesEl.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  if (color === null) {
    noneEl.classList.add('active');
  } else {
    const idx = PRESET_COLORS.indexOf(color);
    if (idx >= 0) swatchesEl.querySelectorAll('.swatch:not(.swatch-none)')[idx]?.classList.add('active');
  }
}

function updatePickerPreview(color) {
  if (color === null) {
    pickerPreview.classList.add('is-empty');
    pickerPreview.style.background = '';
    pickerPreview.style.color = '';
    pickerPreview.style.border = '';
    pickerPreview.style.boxShadow = '';
    pickerPreview.style.textShadow = '';
  } else if (isBright(color)) {
    pickerPreview.classList.remove('is-empty');
    const dark = color.toLowerCase() === '#fffdf9' ? '#2b2d38' : getDarkenedColor(color);
    pickerPreview.style.background = color;
    pickerPreview.style.color = dark;
    pickerPreview.style.border = 'none';
    pickerPreview.style.boxShadow = '0 0 12px rgba(180,220,255,0.12), inset 0 0 0 1px rgba(0,0,0,0.08)';
    pickerPreview.style.textShadow = 'none';
  } else {
    pickerPreview.classList.remove('is-empty');
    pickerPreview.style.background = color;
    pickerPreview.style.color = '#fffdf9';
    pickerPreview.style.border = 'none';
    pickerPreview.style.boxShadow = '0 0 12px rgba(180,220,255,0.12), inset 0 1px 0 rgba(255,255,255,0.20)';
    pickerPreview.style.textShadow = 'none';
  }
}

/* ══ ピッカー: 開閉 ══ */
function openPicker(letter) {
  activeLetter = letter;
  pendingColor = colorMap[letter] || null;

  pickerTitle.textContent = `${LETTER_LABELS[letter]} の色を選択`;
  pickerPreview.textContent = BUBBLE_LABELS[letter];
  updatePickerPreview(pendingColor);

  // スウォッチ初期選択
  swatchesEl.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  if (pendingColor === null) {
    noneEl.classList.add('active');
  } else {
    const idx = PRESET_COLORS.indexOf(pendingColor);
    if (idx >= 0) swatchesEl.querySelectorAll('.swatch:not(.swatch-none)')[idx]?.classList.add('active');
  }

  pickerPanel.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closePicker() {
  pickerPanel.classList.remove('active');
  document.body.style.overflow = '';
  activeLetter = null;
}

pickerClose.addEventListener('click', closePicker);
pickerBackdrop.addEventListener('click', closePicker);

/* ══ クリア ══ */
btnClear.addEventListener('click', () => {
  if (!activeLetter) return;
  const letter = activeLetter;
  delete colorMap[letter];
  applyColor(letter, null);
  updateProgress();
  updateResultPalette();
  updateURL();
  closePicker();
  showToast(`${LETTER_LABELS[letter]} の色をクリアしました`);
});

/* ══ 決定 ══ */
btnDecide.addEventListener('click', () => {
  if (!activeLetter) return;
  if (pendingColor === null) {
    delete colorMap[activeLetter];
    applyColor(activeLetter, null);
  } else {
    colorMap[activeLetter] = pendingColor;
    applyColor(activeLetter, pendingColor);
  }
  updateProgress();
  updateResultPalette();
  updateURL();
  closePicker();
});

/* ══ ユーティリティ ══ */
function hexToRgb(hex) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function getLuminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  const toLinear = c => { c /= 255; return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  return 0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b);
}
function rgbToHsl(hex) {
  let { r, g, b } = hexToRgb(hex);
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0, s=0, l=(max+min)/2;
  if (max!==min) {
    const d=max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=((g-b)/d+(g<b?6:0))/6; break;
      case g: h=((b-r)/d+2)/6; break;
      case b: h=((r-g)/d+4)/6; break;
    }
  }
  return { h:h*360, s, l };
}
// 無彩色判定（彩度が低い = 黒・白・グレー系）
function isAchromatic(hex) {
  return rgbToHsl(hex).s < 0.12;
}
// 淡色判定（白に近いレベルのみ縁取りが必要）
function isBright(hex) {
  return getLuminance(hex) > 0.88;
}
// 明色を少し暗くしてガラスグラデーションが見えるようにする（彩度を落として色みを中立に）
function subtleDarken(hex) {
  const { h, s, l } = rgbToHsl(hex);
  return `hsl(${Math.round(h)},0%,${Math.round(l*0.82*100)}%)`;
}
// 選択色を暗くした「縁取り用カラー」を生成（黒にならないよう下限あり）
function getDarkenedColor(hex) {
  const { h, s, l } = rgbToHsl(hex);
  const newL = Math.max(0.18, l * 0.48);
  // 無彩色（白・グレー）は彩度を上げずそのままグレー系にする
  const newS = isAchromatic(hex) ? Math.min(s, 0.08) : Math.min(1, Math.max(s, 0.65));
  function hslToHex(hh, ss, ll) {
    const k = n => (n + hh/30) % 12;
    const a = ss * Math.min(ll, 1-ll);
    const f = n => ll - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
    const toHex = x => Math.round(x*255).toString(16).padStart(2,'0');
    return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
  }
  return hslToHex(h, newS, newL);
}

/* ══ バブルに色を適用 ══ */
function applyColor(letter, color) {
  const cell = alphaGrid.querySelector(`[data-letter="${letter}"]`);
  if (!cell) return;
  const bubble = cell.querySelector('.alpha-bubble');
  const span   = bubble.querySelector('span');
  if (color) {
    cell.classList.add('selected');
    if (isBright(color)) {
      // 淡色：少し暗くしてガラスグラデーションを可視化、ダーク文字＋inset縁（resultと同じ）
      bubble.style.background = color;
      bubble.setAttribute('data-bright', '1');
      bubble.style.border = 'none';
      bubble.style.boxShadow = '0 0 12px rgba(180,220,255,0.12), inset 0 0 0 1px rgba(0,0,0,0.08)';
      span.style.color = '#9698a8';
      span.style.textShadow = 'none';
      span.style.webkitTextStroke = '0';
    } else {
      // 濃色：白文字＋ガラス発光
      bubble.style.background = color;
      bubble.setAttribute('data-bright', '0');
      bubble.style.border = 'none';
      bubble.style.boxShadow = '0 0 12px rgba(180,220,255,0.12), inset 0 1px 0 rgba(255,255,255,0.20)';
      span.style.color = '#fffdf9';
      span.style.textShadow = 'none';
      span.style.webkitTextStroke = '0';
    }
  } else {
    cell.classList.remove('selected');
    bubble.removeAttribute('data-bright');
    bubble.style.background = '';
    bubble.style.border = '';
    bubble.style.boxShadow = '';
    span.style.color = '';
    span.style.textShadow = '';
    span.style.webkitTextStroke = '';
  }
}

/* ══ 進捗更新（グラデーションバー付き） ══ */
function updateProgress() {
  const letters = LETTERS_10;
  const total = letters.length;
  const done = letters.filter(l => colorMap[l]).length;
  // 分母を動的更新（MAX時は分母分子ともに白に）
  const countEl = document.querySelector('.progress-count');
  if (done === total) {
    countEl.innerHTML = `<span style="color:#fffdf9">${done}</span> / <span style="color:#fffdf9">${total}</span>`;
  } else if (done === 0) {
    countEl.innerHTML = `<span style="color:var(--c1)">${done}</span> / ${total}`;
  } else {
    countEl.innerHTML = `<span style="color:#fffdf9">${done}</span> / ${total}`;
  }
  progressFill.style.width = (done / total * 100) + '%';
  btnResult.disabled = done === 0;

  // ── グラデーション生成 ──
  const selectedColors = letters.map(l => colorMap[l]).filter(Boolean);
  const gradientColors = selectedColors;

  if (gradientColors.length === 0) {
    progressFill.style.background = 'linear-gradient(90deg, #ff7f7f, #ffae66)';
    return;
  }
  if (gradientColors.length === 1) {
    // 単色でも幅が分かるよう少し明暗を付ける
    const { h, s, l } = rgbToHsl(gradientColors[0]);
    function hslStr(hh, ss, ll) { return `hsl(${Math.round(hh)},${Math.round(ss*100)}%,${Math.round(ll*100)}%)`; }
    progressFill.style.background = `linear-gradient(90deg, ${hslStr(h, s, Math.max(0.2, l-0.12))}, ${hslStr(h, s, Math.min(0.85, l+0.1))})`;
    return;
  }

  // 色ごとのカウント集計（有彩色のみ）
  const colorWeights = {};
  gradientColors.forEach(c => { colorWeights[c] = (colorWeights[c] || 0) + 1; });

  // hue順ソート＋重み付きでstopを生成
  const weightedColors = [];
  Object.entries(colorWeights).forEach(([c, w]) => {
    for (let i = 0; i < w; i++) weightedColors.push({ c, h: rgbToHsl(c).h });
  });
  weightedColors.sort((a, b) => a.h - b.h);

  const stops = [];
  const totalW = weightedColors.length;
  let acc = 0;
  stops.push(`${weightedColors[0].c} 0%`);
  weightedColors.forEach(item => {
    acc += 1;
    stops.push(`${item.c} ${Math.round(acc / totalW * 100)}%`);
  });

  progressFill.style.background = `linear-gradient(90deg, ${stops.join(', ')})`;
}

/* ══ 結果パレット更新 ══ */
function updateResultPalette() {
  if (!resultPalette) return;
  resultPalette.innerHTML = '';
  const letters = LETTERS_10;
  const done = letters.filter(l => colorMap[l]).length;
  if (resultMeta) resultMeta.textContent = `${done}教科に色が設定されています`;

  letters.forEach(l => {
    const color = colorMap[l] || null;
    const item = document.createElement('div');
    item.className = 'palette-item';
    item.innerHTML = `
      <div class="palette-dot ${color ? 'colored' : ''}" style="${color ? `background:${color};border-color:${color};` : ''}">
        ${!color ? `<span style="font-family:var(--outfit);font-size:0.65rem;font-weight:700;color:var(--border)">${l}</span>` : ''}
      </div>
      <span class="palette-letter">${l}</span>
    `;
    item.addEventListener('click', () => openPicker(l));
    resultPalette.appendChild(item);
  });
}

/* ══ リセット ══ */
btnReset.addEventListener('click', () => {
  if (!confirm('すべての色設定をリセットしますか？')) return;
  colorMap = {};
  const letters = LETTERS_10;
  letters.forEach(l => applyColor(l, null));
  updateProgress();
  updateResultPalette();
  history.replaceState(null, '', location.pathname);
  showToast('リセットしました');
});

/* ══ 結果ページへ遷移 ══ */
const COLOR_IDS = '0123456789ABC';
function colorToId(hex) {
  const i = PRESET_COLORS.indexOf(hex);
  return i >= 0 ? COLOR_IDS[i] : '-';
}

/* ══ URL同期（リロード復元用） ══ */
function updateURL() {
  const letters = LETTERS_10;
  const encoded = letters.map(l => colorToId(colorMap[l] || '')).join('');
  history.replaceState(null, '', `?mode=subject&r=${encoded}`);
}

btnResult.addEventListener('click', () => {
  const letters = LETTERS_10;
  const done = letters.filter(l => colorMap[l]).length;
  if (done === 0) { showToast('色を1つ以上設定してから結果を見よう'); return; }
  const encoded = letters.map(l => colorToId(colorMap[l] || '')).join('');
  const resultUrl = `result.html?mode=subject&r=${encoded}#submit`;

  const voteKey = `ss_voted_subject_${encoded}`;
  sessionStorage.setItem('ss_vote_key', voteKey);
  const alreadyVoted = localStorage.getItem('ss_submitted_subject') === '1';
  if (!alreadyVoted) {
    sessionStorage.setItem('ss_from_alphabet', '1');
    sessionStorage.removeItem(voteKey);
  } else {
    sessionStorage.removeItem('ss_from_alphabet');
  }

  window.location.href = resultUrl;
});

/* ══ Toast通知 ══ */
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ══ BLOBカラーアニメーション ══ */
(function() {
  const b1 = document.getElementById('pageBlob1');
  const b2 = document.getElementById('pageBlob2');
  const b3 = document.getElementById('pageBlob3');
  if (!b1 || !b2) return;
  const blobs = [
    { el: b1, hue: 240, speed: 14, alpha: 0.55, sat: 55, lit: 28 }, // 深い青紫
    { el: b2, hue: 340, speed: 10, alpha: 0.42, sat: 60, lit: 24 }, // 深い赤
    { el: b3, hue: 180, speed: 18, alpha: 0.32, sat: 50, lit: 22 }, // 深いティール
  ].filter(b => b.el);
  function hslToRgba(h, s, l, a) {
    h = h % 360; s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const f = n => l - Math.min(l, 1-l) * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
    return `rgba(${Math.round(f(0)*255)},${Math.round(f(8)*255)},${Math.round(f(4)*255)},${a})`;
  }
  function setColor(b) {
    b.el.style.background = `radial-gradient(circle, ${hslToRgba(b.hue, b.sat, b.lit, b.alpha)} 0%, transparent 68%)`;
  }
  blobs.forEach(setColor);
  let last = null;
  function tick(ts) {
    if (last !== null) {
      const dt = (ts - last) / 1000;
      blobs.forEach(b => { b.hue = (b.hue + b.speed * dt) % 360; setColor(b); });
    }
    last = ts;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* ══ 初期化 ══ */
buildGrid();
updateProgress();
updateResultPalette();
</script>
